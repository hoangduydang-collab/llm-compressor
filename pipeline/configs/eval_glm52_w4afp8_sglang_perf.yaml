# Full-performance GLM-5.2-W4AFP8 eval (Phala-like SGLang settings).
#
# Requires a clean sglang-eval venv (sglang==0.5.13.post1 first, torch 2.11.x).
# Do NOT pip install -e llm-compressor into that venv.
#
#   source /mnt/nfs/hoangduy/venvs/sglang-eval/bin/activate
#   export PYTHONPATH=/mnt/nfs/hoangduy/projects/llm-compressor
#   python -c "import torch; print(torch.__version__)"   # expect 2.11.x
#
#   python -m pipeline.evalsuite.cli run \
#     --config pipeline/configs/eval_glm52_w4afp8_sglang_perf.yaml \
#     --out evals/glm52-w4afp8-phala
#
# On 8x H100 80GB this may still OOM during CUDA graph capture — use
# eval_glm52_w4afp8_sglang_safe.yaml or an H200 node instead.

name: eval-glm52-w4afp8-sglang-perf

model:
  id: /mnt/nfs/hoangduy/hf_assets/PhalaCloud/GLM-5.2-W4AFP8
  trust_remote_code: true

serve:
  tensor_parallel_size: 8
  max_model_len: 8192
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  sglang_compat_fallbacks: false
  sglang_kwargs:
    quantization: w4afp8
    disable_shared_experts_fusion: true

eval:
  enabled: true
  log_samples: true
  backend: sglang
  apply_chat_template: true
  baseline: null
  tasks:
    - name: wikitext
      metric: word_perplexity,none
      higher_is_better: false
      num_fewshot: 0
      limit: null
    - name: mmlu
      metric: acc,none
      num_fewshot: 5
      limit: null
    - name: arc_challenge
      metric: acc_norm,none
      num_fewshot: 25
      limit: null
    - name: hellaswag
      metric: acc_norm,none
      num_fewshot: 10
      limit: null
    - name: winogrande
      metric: acc,none
      num_fewshot: 5
      limit: null
    - name: gsm8k
      metric: exact_match,strict-match
      num_fewshot: 5
      limit: null
    - name: truthfulqa_mc2
      metric: acc,none
      num_fewshot: 0
      limit: null
    - name: bbh
      metric: exact_match,get-answer
      num_fewshot: 3
      limit: null

agentic:
  enabled: false

quantization:
  method: gptq
  scheme: W4AFP8
