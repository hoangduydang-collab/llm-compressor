apiVersion: batch/v1
kind: Job
metadata:
  generateName: hd-stage-aa-lcr-v11-
  namespace: evaluation
  labels:
    owner: hoangduy.dang
    purpose: aa-lcr-v11-staging
    aa-lcr-run-id: aa-lcr-v11-stage
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels:
        owner: hoangduy.dang
        purpose: aa-lcr-v11-staging
        aa-lcr-run-id: aa-lcr-v11-stage
    spec:
      restartPolicy: Never
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: stage
          image: python:3.12-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: TIKTOKEN_CACHE_DIR, value: "/mnt/cephfs/hoangduy/cache/aa-lcr-v11-tiktoken"}
            - {name: CL100K_CACHE_FILE, value: "9b5ad71b2ce5302211f9c61530b329a4922fc6a4"}
            - {name: CL100K_BPE_SHA256, value: "223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7"}
            - {name: TIKTOKEN_READY_MARKER, value: "/mnt/cephfs/hoangduy/cache/aa-lcr-v11-tiktoken/cl100k_base.ready"}
            - name: AA_LCR_CODE_REVISION
              valueFrom:
                configMapKeyRef:
                  name: AA_LCR_CODE_CONFIGMAP
                  key: AA_LCR_CODE_REVISION
          resources:
            requests: {cpu: "2", memory: "4Gi"}
            limits: {cpu: "4", memory: "8Gi"}
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /mnt/cephfs/hoangduy/runlogs
              exec > >(tee -a /mnt/cephfs/hoangduy/runlogs/hd-stage-aa-lcr-v11.log) 2>&1
              LOCK=/workspace/pipeline/requirements-aa-lcr-v11.lock
              DIGEST=$(sha256sum "$LOCK" | awk '{print $1}')
              VENV=/mnt/cephfs/hoangduy/venvs/aa-lcr-v11-py312-${DIGEST:0:12}
              mkdir -p "$TIKTOKEN_CACHE_DIR"
              if [ ! -d "$VENV" ]; then
                python -m venv "$VENV"
                "$VENV/bin/python" -m pip install --require-hashes -r "$LOCK"
                "$VENV/bin/python" --version > "$VENV/python-version.txt"
                "$VENV/bin/python" -m pip freeze > "$VENV/pip-freeze.txt"
                printf '%s\n' "$DIGEST" > "$VENV/requirements-sha256.txt"
              fi
              test "$(cat "$VENV/requirements-sha256.txt")" = "$DIGEST"
              "$VENV/bin/python" -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
              test -s "$TIKTOKEN_CACHE_DIR/$CL100K_CACHE_FILE"
              test "$(sha256sum "$TIKTOKEN_CACHE_DIR/$CL100K_CACHE_FILE" | awk '{print $1}')" = "$CL100K_BPE_SHA256"
              MARKER_TMP="$TIKTOKEN_READY_MARKER.tmp.$$"
              printf '%s %s\n' "$CL100K_CACHE_FILE" "$CL100K_BPE_SHA256" > "$MARKER_TMP"
              mv "$MARKER_TMP" "$TIKTOKEN_READY_MARKER"
              find "$TIKTOKEN_CACHE_DIR" -type f -size +0 -print0 | sort -z | xargs -0 sha256sum > "$VENV/tiktoken-cache-sha256.txt"
              test -s "$VENV/tiktoken-cache-sha256.txt"
              # Candidate endpoint: http://glm-5-3-w4afp8-sglang:30000/v1/chat/completions
              echo "AA-LCR v1.1 environment staged at $VENV"
          volumeMounts:
            - {name: cephfs, mountPath: /mnt/cephfs}
            - {name: code, mountPath: /workspace/pipeline, readOnly: true}
      volumes:
        - name: cephfs
          persistentVolumeClaim: {claimName: model-cache-shared}
        - name: code
          configMap: {name: AA_LCR_CODE_CONFIGMAP}
