# GLM-5.2 W4AFP8 AWQ smoke — the AWQ sibling of
# glm52_distributed_w4afp8_smoke.yaml (GPTQ). Identical model, scheme, layer
# selection, ignore rules and calibration contract, so the two arms are a paired
# method comparison and nothing else varies.
#
# Differences from the GPTQ config, and why each one exists:
#   1. quantization.method: awq
#   2. `gptq_dampening_frac` dropped — GPTQ-only knob.
#   3. output_dir and offload_folder are DISTINCT from the GPTQ arm's.
#
# On (3): MiniMax-M3's two smoke configs
# (minimax_m3_distributed_r8_smoke.yaml and ..._r8a_awq_smoke.yaml) share ONE
# output_dir. That was safe there because M3 ran "one exclusive 8xH100 node at a
# time" — the arms never overlapped. Keep these paths distinct anyway: the two
# GLM-5.2 arms HAVE already run concurrently on 4 GPUs each against the same RWX
# cephfs PVC (2026-08-27), and sharing an output_dir or offload_folder would have
# had them interleaving safetensors shards and offload blobs into the same paths.
# Do not "simplify" these back to matching paths just because a given run happens
# to have an exclusive node.
#
# What this smoke must prove that the GPTQ smoke does not:
#   a. AWQ smooth-layer mappings RESOLVE for GlmMoeDsaForCausalLM. Unlike M3
#      (which needed hand-authored get_minimax_m3_awq_mappings), GLM is
#      registered upstream -> _deepseek_mappings. See BLOCKER A below.
#   b. The up->down expert fold is function-preserving here. It was not on M3 and
#      cost 24 pts GPQA via reasoning non-termination; GLM's plain SwiGLU
#      (act_fn(gate) * up, no clamp, no +1 offset) makes the identical fold legal.
#      Rationale and evidence: GLM52_FROM_M3_CARRYOVER.md.
#   c. AWQ's grid search is NOT hijacked by the FP8-schemed balance layers. Our
#      fp8_dynamic_targets cover self_attn.* and shared_experts.*, which are
#      exactly the modules _deepseek_mappings reaches as balance layers. M3 hit
#      this (r8a smoke); the guard is _is_grid_search_targeted in
#      src/llmcompressor/modifiers/transform/awq/base.py:132.
#   d. Smoothing scales survive disk offload. offload_folder is set, and three
#      separate M3 full runs (r2, r3, r7) lost folds or qparams exactly this way.
#
# BLOCKER A — RESOLVED 2026-08-27 by gate 1, fixed in 7d08e0fa.
#   GlmMoeDsaForCausalLM mapped to _deepseek_mappings, whose MoE-input mapping
#   listed "re:.*mlp.gate$" as a balance layer. GLM-5.2 has
#   first_k_dense_replace=3, so layers 0-2 are dense with no router, and
#   match_modules_set could never close a per-layer set. Gate 1 failed with
#     awq_mapping_resolution_failed: ValueError: AWQ needs to match a single
#     smoothlayer for each mapping but got ['model.layers.0.post_attention_
#     layernorm', 'model.layers.1...', ...]      -> awq_mappings = 0
#   i.e. AWQ would have run with NO smoothing at all. Fixed by pointing both GLM
#   entries at _mla_mixed_dense_moe_mappings (the renamed
#   _glm4_moe_lite_mappings, which omits mlp.gate). Gate 1 resolved 1028
#   mappings when this config targeted four layers (1024 per-expert up->down
#   folds = 4 x 256, plus 4 MoE-input mappings), with zero failures and zero
#   warnings. At the current two layers expect 514. Guarded by
#   tests/llmcompressor/modifiers/awq/test_mixed_dense_moe_mappings.py.
#
#   Also resolved on the same run: GlmMoeDsaRMSNorm was reported as
#   `unclassified_norm_semantics`. Its forward is `self.weight * hidden_states`
#   (plain, not `1 + weight`), so it is now asserted in
#   KNOWN_ORDINARY_NORM_CLASSES rather than left indistinguishable from a norm
#   nobody had inspected — the distinction that the M3 offset-norm incident
#   turned on.
name: glm52_distributed_w4afp8_awq_smoke

model:
  id: zai-org/GLM-5.2
  trust_remote_code: true
  auto_class: AutoModelForCausalLM
  dtype: bfloat16
  device_map: auto_offload
  max_memory:
    # 32e9 -- MiniMax-M3's value, restored after measuring what raising it cost.
    #
    # THE MEASUREMENT (run 20260828t052128z, 8xH100 on gpu03, at cpu=900e9):
    #     weight load                                          66 min
    #     "Dispatching model", 78460 tensors at 8-9.5 it/s      ETA 2h34m
    #     => ~3.7 h of setup before calibration even begins.
    # M3 ran a comparable job END TO END, including the save, in 71 min at 32e9.
    #
    # WHY THIS KNOB CONTROLS THAT. Everything inside the budget is memcpy'd into
    # /dev/shm by DistributedCPUCache.offload (share_memory_() + broadcast +
    # barrier, per tensor); everything beyond it becomes a near-free symlink to
    # the original HF blob. 900e9 copies ~838 GiB, 32e9 copies ~30 GiB. The
    # dispatch is copy-bound, not per-tensor-bound: 6197 tensors dispatched
    # corresponded to 100 GiB of shm (~16.5 MB/tensor against a 19 MB average
    # tensor). A purely per-tensor cost at 8.15 it/s would have made M3's ~40k
    # tensors take 82 min by themselves, which its 71 min total rules out.
    #
    # WHY THE COPY BUYS ALMOST NOTHING. DiskCache.onload reads straight from the
    # symlinked original, through the page cache:
    #     with safe_open(weight_info["safetensors_file"], ...) as file:
    #         onloaded = file.get_tensor(weight_info["weight_name"])
    # A disk-placed unmodified weight served from cache is about as fast as an
    # shm copy; the copy buys GUARANTEED residency rather than BEST-EFFORT. And
    # page cache is charged to the pod's memory cgroup, so the POD MEMORY LIMIT
    # (1700Gi), not this value, is what bounds total residency -- shm and page
    # cache are substitutes, not additions.
    #
    # DO NOT OVERSELL THE REVERT. A small budget SHIFTS cost from dispatch to the
    # sequential walk rather than removing it. The walk is storage-bound and
    # sample-independent: 86 min for 35 untargeted layers is 2.5 min/layer, i.e.
    # 19 GB/layer at ~127 MB/s, which is simply cephfs speed. Projected totals
    # after load:
    #     32e9  -> dispatch   ~5 min + walk ~190 min = ~195 min
    #     900e9 -> dispatch ~155 min + walk  ~82 min = ~237 min
    # Worth ~45 min, not hours.
    #
    # THE ACTUAL REGRESSION IS STORAGE, and no value here fixes it. cephfs
    # measures 31 MB/s single-stream with a 28 ms TCP RTT to the monitor, roughly
    # 4x worse than the old cluster's /mnt/nfs -- which is why M3 finished in
    # 71 min and this does not. The lever is staging the snapshot onto flash (the
    # cluster has an all-flash sc-file-nfs-vast-my class; region unverified, and
    # it needs a ~1.6 Ti PVC, so it is a decision rather than a tweak).
    #
    # TWO TRAPS, both paid for already:
    #  - `auto_offload` is NOT `auto`. compressed_tensors/offload/load.py
    #    intercepts it as "same as auto, but only cpu/disk are visible", so the
    #    device map never places a weight on an accelerator and GPUs contribute
    #    ZERO residency. Measured: 1509 MiB per GPU (bare CUDA context) for the
    #    whole load. Never add VRAM to this budget.
    #  - The offload_folder is NOT a copy of the model. 36838 of its entries are
    #    symlinks to the original blobs; only genuinely modified tensors become
    #    real files. Do not size this budget to "avoid a spill" -- there is none.
    #
    # The algorithm needs no residency at all: the sequential pipeline onloads
    # one decoder layer (~19 GB) at a time, with calibrate/compress/propagate all
    # inside a single `disable_offloading()` block, and IntermediatesCache
    # carrying activations forward so earlier layers are never re-run. This value
    # is a cache, not a requirement.
    #
    # Superseded commits, kept findable: 3f918cd0 (the VRAM correction, still
    # valid), 9efb919b (raised AWQ to 1350e9 against a "585 GB spill" that does
    # not exist; its GPTQ Hessian ceiling reasoning IS still valid), 702d14d0
    # (reverted that to 900e9, for a reason that was right by accident).
    cpu: 32000000000
  offload_folder: /mnt/cephfs/hoangduy/offload/glm52-w4afp8-awq-smoke

quantization:
  method: awq
  scheme: W4AFP8
  ignore:
    - "lm_head"
    - "re:.*mlp[.]gate$"
    - "re:.*mlp[.]shared_experts[.].*"
    - "re:.*self_attn[.].*"
    - "re:.*layers[.][0-2][.].*"
    - "re:.*layers[.]78[.].*"
    # Restrict to the same two sampled MoE layers as the GPTQ arm: 3 (the
    # first MoE layer, so the dense->MoE boundary is exercised) and 42 (a
    # mid-model 'full' layer carrying indexer projections).
    - "re:.*model[.]layers[.](?!(?:3|42)(?:[.]|$))[0-9]+(?:[.]|$).*"
  fp8_dynamic_targets:
    - "re:.*model[.]layers[.](0|3)[.]self_attn[.](q_a_proj|q_b_proj|kv_a_proj_with_mqa|kv_b_proj|o_proj)$"
    - "re:.*model[.]layers[.]3[.]mlp[.]shared_experts[.](gate_proj|up_proj|down_proj)$"
    - "re:.*model[.]layers[.]0[.]mlp[.](gate_proj|up_proj|down_proj)$"
  # Offloaded generation on a 743B model gates the save for many minutes and
  # streams every expert off disk for 64 tokens (M3 incident, 2026-07-07).
  sample_generation: false

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  # 32, up from 8, and it is affordable for a reason opposite to the one first
  # written here. That text said 32 "became affordable once the model went fully
  # RAM-resident (max_memory.cpu 900e9)"; the budget is back at 32e9 and 32
  # samples is still fine, because the sequential WALK is storage-bound and
  # therefore sample-independent. Measured: 86 min for 35 untargeted layers is
  # 2.5 min/layer = 19 GB/layer at ~127 MB/s, i.e. cephfs read speed. The walk
  # pays per BYTE OF WEIGHTS, not per sample, so 8 -> 32 barely moves it.
  #
  # What samples DO scale is the work on targeted layers only, which is 2 of 78
  # here. Keep an eye on that for the GPTQ arm specifically, where
  # offload_hessians round-trips each Hessian over PCIe once per module per
  # sample (~3.6 TiB/layer at 8 samples, ~14.4 TiB at 32).
  #
  # 32 rather than the production 512 because the per-targeted-layer cost at 32
  # is still unmeasured -- no run has yet reached calibration on this model.
  # Measure a targeted layer's compression time before raising it further.
  num_samples: 32
  max_seq_length: 512
  seed: 42
  moe_calibrate_all_experts: true
  sequential_targets: ["GlmMoeDsaDecoderLayer"]
  pipeline: sequential

serve:
  enabled: false

eval:
  enabled: false

output_dir: /mnt/cephfs/hoangduy/results/glm52-w4afp8-awq-smoke
