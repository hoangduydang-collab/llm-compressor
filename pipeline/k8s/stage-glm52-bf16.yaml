---
# One-shot Job: stage zai-org/GLM-5.2 (BF16, ~1.35 TiB) into the cephfs HF cache
# on the infermesh-test cluster, so the quantization run has a BF16 source.
#
#   kubectl apply -f pipeline/k8s/stage-glm52-bf16.yaml
#   kubectl logs -n evaluation -f job/stage-glm52-bf16
#   kubectl delete -f pipeline/k8s/stage-glm52-bf16.yaml    # ttl also cleans up
#
# Modelled on infermesh's _prestage/prepull-glm-5-2-w4afp8-ca.yaml, which is the
# convention for the CA region: all 6 CA prestage Jobs use
# `HF_HUB_CACHE=<mount>/.hf-cache` against `claimName: model-cache-shared`, so
# the model lands at `.hf-cache/models--zai-org--GLM-5.2`. Two deliberate
# departures from that file: namespace `evaluation` (this is infermesh-test, not
# prod), and NO nodeSelector — its pin to a named prod node does not exist here,
# and letting the scheduler place us avoids contending for one specific node.
#
# BLAST RADIUS. The intended effect is exactly one thing: a new model directory
# appears on the shared PVC. Everything else is constrained to that.
#   * Requests NO GPU. The resources block omits nvidia.com/gpu entirely, so it
#     reserves none and cannot preempt anyone's training or serving pod. It does
#     tolerate the nvidia.com/gpu taint, which is unavoidable: the
#     model-cache-shared PV is region-pinned to ca-van3 and every ca-van3 node is
#     a tainted GPU node, so there is no CPU-only node that can mount the cache.
#   * Writes ONLY inside its own repo directory. huggingface-cli keys the cache
#     by repo id, so it creates `models--zai-org--GLM-5.2` and its `.locks`
#     entry, and touches no other model. Nothing here deletes or rewrites.
#   * Fails closed on free space BEFORE downloading, so it cannot be the thing
#     that fills a volume other people depend on.
#   * Refuses to redownload if the snapshot is already complete, so re-applying
#     is cheap rather than another 1.35 TiB of traffic.
#   * Parallelism is 6 processes x `--max-workers 4`. See REVISION below: the
#     original halved-workers single stream was measured at 140 MiB/s because
#     files were fetched one at a time, so halving had cost 2.6 h of wall-clock
#     while buying nobody any relief. The revised setting trades a short window
#     of higher cephfs write load for finishing sooner.
#   * Scoped `du` only. Never `du -sh` the whole cache — that is a metadata storm
#     on cephfs for every other reader.
#   * Bounded and self-cleaning: activeDeadlineSeconds, backoffLimit,
#     ttlSecondsAfterFinished, so it cannot linger holding a node slot.
#
# `priorityClassName` is deliberately unset: our token cannot list
# priorityclasses, so naming one would be a guess. Default priority is safe here
# because a zero-GPU pod cannot evict GPU workloads.
#
# ---------------------------------------------------------------------------
# REVISION 2026-08-26: bucketed parallel download.
#
# The first revision ran a single `huggingface-cli download --max-workers 8`.
# Six consecutive samples of the blobs dir found exactly ONE `.incomplete` file,
# its size resetting each time: files were being fetched strictly one at a time,
# so `--max-workers 8` bought nothing — the file-level ThreadPoolExecutor is
# effectively serial once hf_transfer is doing the per-file chunking. Local
# resources all had headroom too: NIC 10 Gbps at 12%, node CPU 1% of 192 cores,
# cgroup throttling 0.85%.
#
# That serialization was real, but it was NOT the constraint — see OUTCOME below
# before assuming this revision made anything faster.
#
# Fix: replace the one process with SIX CONCURRENT PROCESSES over disjoint file
# sets. Separate processes cannot be serialized by a shared thread pool or GIL
# the way threads inside one process were. The repo has 282 shards named
# `model-000NN-of-00282.safetensors` and the digit before `-of-` distributes
# 28-29 shards per value, so bucketing on that digit needs no shard list and
# stays balanced: five buckets of ~56 shards, plus one small process for the 13
# non-shard files.
#
# The 4-core cap is lifted to 8 requested / 24 limit for the six processes.
# That is 12% of this node's 192 cores, and `kubectl top` showed the node at 1%.
#
# Restarting costs at most one in-flight shard (~5 GiB). Every completed blob is
# reused — the HF cache is keyed by content hash, so the ~168 GiB already staged
# was NOT redownloaded.
#
# ---------------------------------------------------------------------------
# OUTCOME 2026-08-26: bucketing did NOT speed anything up. Read this before
# reaching for more parallelism here.
#
# Measured from NIC rx_bytes (see the MEASUREMENT WARNING below on why not du):
#     1 process,  1 concurrent file   ->  94 MiB/s
#     6 processes, 5 concurrent files ->  98 MiB/s    (+4% for 5x concurrency)
#
# The ceiling is the ca-van3 egress path to huggingface.co, not our client.
# Two independent probes confirmed it, each pulling byte ranges to /dev/null
# from a CA node other than the job's, while the job ran:
#     probe on ca-gpu03, 16 conns  ->   3 MiB/s   (job held 93 MiB/s)
#     probe on ca-gpu04, 16 conns  ->  12 MiB/s   (job held 93 MiB/s)
# A second consumer gets scraps, so the region is saturated at ~100 MiB/s
# aggregate. More pods, processes, or connections cannot beat that. 1404 GiB
# therefore takes ~4.2 h wall-clock and no download tuning changes that.
#
# Alternate sources, measured from ca-gpu04, are all WORSE from this region:
#     huggingface.co  12.3 MiB/s   |   hf-mirror.com   1.6 MiB/s
#     modelscope.cn    4.5 MiB/s
# Worth recording anyway: GLM-5.2 exists on ModelScope as `ZhipuAI/GLM-5.2`
# (NOT `zai-org/GLM-5.2`, which 404s there). That is a fallback for when HF is
# unreachable, not a way to go faster.
#
# The bucketing is KEPT despite flat throughput, for two reasons that are not
# speed: a stalled bucket no longer stalls the whole transfer, and restarting
# again to revert would re-cost the in-flight shards for no gain. It is NOT a
# throughput lever — do not scale the bucket count up expecting one.
#
# MEASUREMENT WARNING. hf_transfer preallocates each ~5 GiB shard, so `du` on
# the blobs dir jumps by 5 GiB when a file STARTS and then sits flat while it
# fills. Sampling du over 30-120 s yields anywhere from 28 to 140 MiB/s
# depending on whether the window happened to catch a file start; an earlier
# "140 MiB/s" reading was exactly that artifact, and it is what made the serial
# download look faster than it was. Always measure with
# /sys/class/net/eth0/statistics/rx_bytes over a >=60 s window.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: stage-glm52-bf16
  namespace: evaluation
  labels:
    owner: hoangduy.dang
    purpose: model-prestage
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  # 1.35 TiB. Generous but bounded — a stalled job must not hold a slot forever.
  activeDeadlineSeconds: 86400
  template:
    metadata:
      labels:
        owner: hoangduy.dang
        purpose: model-prestage
    spec:
      # OnFailure restarts in place; the HF cache resumes from partial blobs
      # rather than starting the 1.35 TiB over.
      restartPolicy: OnFailure
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: download
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - {name: MODEL_ID, value: "zai-org/GLM-5.2"}
            - {name: HF_HUB_CACHE, value: "/models/.hf-cache"}
            # Measured from the repo listing, not guessed: 282 shards,
            # 1403.2 GiB total. The free-space guard needs what REMAINS, since
            # part of the snapshot is usually already staged.
            - {name: TOTAL_GIB, value: "1404"}
            - {name: EXPECTED_SHARDS, value: "282"}
            - {name: HEADROOM_GIB, value: "60"}
            # Per-process worker count. Parallelism comes from BUCKETS (separate
            # processes); this is only the in-process pool, kept small so total
            # connection count stays bounded.
            - {name: MAX_WORKERS, value: "4"}
            # Stall watchdog. A wedged hf_transfer socket shows up as zero
            # growth in the blobs dir; two consecutive quiet samples (8 min)
            # means kill the workers so their retry loops relaunch them.
            # Sized well above a slow-but-live shard: at even 5 MiB/s a 4 min
            # window still grows by ~1.2 GiB, so this cannot misfire on
            # progress that is merely slow.
            - {name: SAMPLE_SECS, value: "240"}
            - {name: STALL_STRIKES, value: "2"}
            - {name: MAX_ATTEMPTS, value: "20"}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              REPO_DIR="$HF_HUB_CACHE/models--$(echo "$MODEL_ID" | sed 's#/#--#g')"

              echo "==> target: $REPO_DIR"

              # --- guard 1: free space, fail closed -------------------------
              # Require only what is still MISSING plus headroom. Demanding the
              # full 1404 GiB would spuriously abort a resume that is already
              # most of the way done.
              DONE_GIB=$(du -sm "$REPO_DIR/blobs" 2>/dev/null | cut -f1 || echo 0)
              DONE_GIB=$(( ${DONE_GIB:-0} / 1024 ))
              NEED_GIB=$(( TOTAL_GIB - DONE_GIB + HEADROOM_GIB ))
              AVAIL_GIB=$(df -B1G --output=avail "$HF_HUB_CACHE" 2>/dev/null \
                          | tail -1 | tr -d ' ')
              echo "==> already staged: ${DONE_GIB} GiB of ${TOTAL_GIB} GiB"
              echo "==> free on cache volume: ${AVAIL_GIB} GiB (need ${NEED_GIB})"
              if [ "$AVAIL_GIB" -lt "$NEED_GIB" ]; then
                echo "ABORT: insufficient free space; refusing to fill shared storage" >&2
                exit 1
              fi

              # --- guard 2: already staged? ---------------------------------
              # A complete snapshot has the index plus every shard it names.
              IDX=$(find "$REPO_DIR/snapshots" -name model.safetensors.index.json \
                    2>/dev/null | head -1 || true)
              if [ -n "$IDX" ]; then
                SNAP=$(dirname "$IDX")
                WANT=$(grep -o '"model-[0-9]*-of-[0-9]*\.safetensors"' "$IDX" \
                       | sort -u | wc -l)
                HAVE=$(find "$SNAP" -name '*.safetensors' | wc -l)
                echo "==> existing snapshot: $HAVE/$WANT shards resolved"
                if [ "$WANT" -gt 0 ] && [ "$HAVE" -ge "$WANT" ]; then
                  echo "==> already complete; nothing to download"
                  du -sh "$REPO_DIR" 2>/dev/null || true
                  echo DONE
                  exit 0
                fi
                echo "==> incomplete, resuming"
              fi

              pip install --quiet --no-cache-dir 'huggingface_hub==0.27.1' hf_transfer
              export HF_HUB_ENABLE_HF_TRANSFER=1
              export HF_HUB_DISABLE_XET=1
              export HF_HUB_ETAG_TIMEOUT=30

              blobs_mib() { du -sm "$REPO_DIR/blobs" 2>/dev/null | cut -f1 \
                            || echo 0; }

              # Kill wedged download workers. hf_transfer offers no stall
              # timeout, so a socket that goes quiet hangs its process forever.
              #
              # Matched on /proc/<pid>/comm FIRST, deliberately: the parent shell
              # runs this whole script as its argv, so ITS cmdline also contains
              # the string "huggingface-cli download" and a naive cmdline match
              # would kill the job itself. comm is the exec'd binary, so the
              # parent (comm=sh) and this watchdog can never be candidates.
              # pkill is not an option — python:3.11-slim ships no procps, which
              # is how an earlier attempt at this failed silently with rc=127.
              kill_workers() {
                for d in /proc/[0-9]*; do
                  pid=${d#/proc/}
                  [ "$pid" = "1" ] && continue
                  case "$(cat "$d/comm" 2>/dev/null)" in
                    python*|huggingface*) ;;
                    *) continue ;;
                  esac
                  case "$(tr '\0' ' ' < "$d/cmdline" 2>/dev/null)" in
                    *huggingface-cli*download*)
                      kill -9 "$pid" 2>/dev/null \
                        && echo "[watchdog] killed wedged pid $pid" ;;
                  esac
                done
                return 0
              }

              # --- progress + stall watchdog --------------------------------
              # Scoped to our own blobs dir. Never du the whole cache: that is a
              # metadata storm on cephfs for every other reader.
              ( LAST=-1; STRIKES=0
                while true; do
                  sleep "$SAMPLE_SECS"
                  NOW=$(blobs_mib)
                  echo "[progress] $(( ${NOW:-0} / 1024 )) / ${TOTAL_GIB} GiB"
                  if [ "${NOW:-0}" -le "$LAST" ]; then
                    STRIKES=$(( STRIKES + 1 ))
                    echo "[watchdog] no progress in ${SAMPLE_SECS}s" \
                         "(strike ${STRIKES}/${STALL_STRIKES})"
                    if [ "$STRIKES" -ge "$STALL_STRIKES" ]; then
                      kill_workers
                      STRIKES=0
                    fi
                  else
                    STRIKES=0
                  fi
                  LAST=${NOW:-0}
                done ) &
              WATCHDOG=$!
              trap 'kill "$WATCHDOG" 2>/dev/null || true' EXIT INT TERM

              # --- bucketed parallel download, each with its own retries -----
              # Shards are model-000NN-of-00282.safetensors; the digit before
              # `-of-` is evenly distributed (28-29 shards per value), so these
              # five globs partition the 282 shards into ~56 each with no shard
              # list and no overlap. fnmatch expands [01] as a character set,
              # and the glob anchors that digit immediately before `-of-`, so a
              # shard can match exactly one bucket.
              #
              # The retry loop is the other half of the watchdog: the watchdog
              # kills a wedged attempt, and this relaunches it. Restarts are
              # cheap because the HF cache is content-keyed, so only the shard
              # that was in flight is refetched.
              run_bucket() {
                bn=$1; log="/tmp/bucket-${bn}.log"; shift
                a=0
                while [ "$a" -lt "$MAX_ATTEMPTS" ]; do
                  a=$(( a + 1 ))
                  echo "--- attempt $a at $(date -u +%H:%M:%S) ---" >> "$log"
                  if huggingface-cli download "$MODEL_ID" "$@" \
                       --max-workers "$MAX_WORKERS" >> "$log" 2>&1; then
                    echo "[bucket $bn] complete after $a attempt(s)"
                    return 0
                  fi
                  echo "[bucket $bn] attempt $a died; retrying in 10s"
                  sleep 10
                done
                echo "[bucket $bn] EXHAUSTED $MAX_ATTEMPTS attempts" >&2
                return 1
              }

              PIDS=""
              N=0
              for PAT in '[01]' '[23]' '[45]' '[67]' '[89]'; do
                N=$(( N + 1 ))
                run_bucket "$N" --include "model-*${PAT}-of-*.safetensors" &
                PIDS="$PIDS $!"
                echo "==> bucket $N  model-*${PAT}-of-*.safetensors  pid $!"
              done

              # Config, tokenizer, and the weight index: small, and the index is
              # what the completeness check below reads.
              run_bucket meta --exclude "model-*-of-*.safetensors" &
              PIDS="$PIDS $!"
              echo "==> bucket meta (non-shard files) pid $!"

              RC=0
              for P in $PIDS; do
                wait "$P" || { RC=1; echo "==> pid $P FAILED" >&2; }
              done
              if [ "$RC" -ne 0 ]; then
                echo "ABORT: a bucket exhausted its retries; tails follow" >&2
                tail -n 25 /tmp/bucket-*.log >&2
                exit 1
              fi

              # --- sweep + completeness gate, fail closed -------------------
              # One serial pass fills anything a bucket glob could have missed
              # and materializes the snapshot dir. Cheap when nothing is absent.
              echo "==> sweep pass"
              huggingface-cli download "$MODEL_ID" --max-workers "$MAX_WORKERS"

              HAVE=$(find "$REPO_DIR/snapshots" -name '*.safetensors' | wc -l)
              echo "==> shards resolved: $HAVE / $EXPECTED_SHARDS"
              if [ "$HAVE" -lt "$EXPECTED_SHARDS" ]; then
                echo "ABORT: incomplete snapshot; not marking this staged" >&2
                exit 1
              fi

              # Scoped only — never du the whole cache.
              du -sh "$REPO_DIR" 2>/dev/null || true
              echo DONE
          envFrom:
            # Not present in this namespace today; GLM-5.2 is public and
            # ungated, so anonymous download works. Optional so the Job still
            # runs, and picks a token up automatically if one is ever added.
            - secretRef: {name: hf-token, optional: true}
          resources:
            requests:
              cpu: "8"
              memory: "8Gi"
              ephemeral-storage: "2Gi"
            limits:
              # Six hf_transfer processes. 24 cores is 12% of this node's 192,
              # and `kubectl top node` measured the node at 1% CPU / 0% memory.
              cpu: "24"
              memory: "24Gi"
              # Downloads land on the PVC, not node disk; this only has to cover
              # pip and hf_transfer scratch. Capped so a runaway local write
              # cannot fill the node's disk under other pods.
              ephemeral-storage: "4Gi"
          volumeMounts:
            - {name: model-cache, mountPath: /models}
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache-shared
