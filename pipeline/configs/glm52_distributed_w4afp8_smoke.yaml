# GLM-5.2 W4AFP8 smoke: first quantization run of ANY method on a family that
# is not MiniMax-M3, and the first exercise of the glm_moe_dsa linearize path
# added in 052cbec9. Layer-scoped so the run is self-documenting and cheap:
#
#   - GPTQ W4AFP8 routed experts : layers 3, 6, 42, 77
#   - FP8 MLA attention          : layers 0, 3, 6   (NOT the indexer)
#   - FP8 shared experts         : layers 3, 6
#   - FP8 dense MLP              : layer 0
#
# Layer choice is deliberate, not arbitrary:
#   - 3 is the first MoE layer (first_k_dense_replace = 3), 77 is the last, so
#     the eligibility gate is proven at both ends of the stack.
#   - Only 21 of the 78 layers are "full" and carry indexer projections at all;
#     from the released config's explicit `indexer_types`, those are 0, 1, 2,
#     then every 4th from 6 to 74. So 6 and 42 are full while 3 and 77 are
#     shared, and the indexer-exclusion invariant is proven on both kinds and on
#     both legs (layer 0 is full on the FP8 side, 3 and 6 cover both there).
#     Note 77 is NOT full — 74 is the last full layer.
#   - Layer 0 covers the dense GlmMoeDsaMLP path.
#
# An earlier revision used layers 3, 8, 40, 77 on the belief that 8 and 40 were
# full. They are not: all four were shared, so the GPTQ leg proved nothing about
# a full layer. The pattern must be read from `indexer_types` in the real
# config.json — deriving it from `index_topk_freq` yields a different list.
#
# Note where this DIVERGES from minimax_m3_distributed_r8_smoke.yaml's
# rationale: M3 included layer 0 to prove the save-side conversion of an
# FP8-quantized FUSED gate_up_proj (fused in memory, split on disk). GLM-5.2's
# dense and shared MLPs are unfused in both places, so that specific risk does
# not exist here and layer 0 earns its place for a different reason. Do not
# carry M3's justification across.
#
# What this smoke must prove before the full run spends the GPU budget:
#   1. glm_moe_dsa takes the fast direct-2D-load path (052cbec9) on a real
#      checkpoint, not just the CPU stand-in it was verified against.
#   2. The routed experts land as int4 g128 at `mlp.experts.N.{gate,up,down}_proj`.
#   3. All five MLA projections land FP8 and self_attn.indexer.* stays BF16, on
#      both a "full" and a "shared" indexer layer.
#   4. Save-side: get_linearize_load_mappings('glm_moe_dsa') returns THREE load
#      mappings and ZERO save mappings, so saving applies no inverse conversion.
#      That is believed correct — the linearized per-expert names are already
#      GLM's released checkpoint layout — but it means the save path is a no-op
#      rather than a tested transformation, unlike M3 (19 save mappings) or
#      DeepSeek-V4 (40). Verify the written keys, do not assume them.
#   5. The MTP layer is absent. Record whether layer 78 keys exist in the
#      output; they will not, and per BLOCKER 1 in the full config that is a
#      release blocker rather than a curiosity — Phala ships 2337 quantized
#      tensors there and production serves EAGLE off that head.
#
# Launch: the same distributed-quant launcher as the M3 smoke, METHODS=gptq
# EVIDENCE_ONLY=0.
name: glm52_distributed_w4afp8_smoke

model:
  # BLOCKED: not staged. Stage with HF_HUB_CACHE=/mnt/cephfs/.hf-cache so it
  # lands at .hf-cache/models--zai-org--GLM-5.2, matching the production prepull
  # convention; then this id resolves offline. 1.35 TiB. The FP8 release is
  # already staged at .hf-cache/models--zai-org--GLM-5.2-FP8 if we pick that
  # source instead (see BLOCKER 2).
  id: zai-org/GLM-5.2
  trust_remote_code: true
  auto_class: AutoModelForCausalLM
  dtype: bfloat16
  device_map: auto_offload
  max_memory:
    # 900 GB. Raised from the 32e9 inherited from M3, where this arm kept
    # ~1133 GB of the 1485 GB model on the cephfs PVC (31 MB/s single-stream)
    # and storage dominated: 86 min to propagate layers 7-41, which are not even
    # quantized, vs ~4 min to compress a targeted layer.
    #
    # *** THIS DELIBERATELY DOES NOT MATCH THE AWQ ARM (1350e9). ***
    # Every other knob in these two configs is held identical so the arms are a
    # paired method comparison -- this one cannot be, and copying the AWQ value
    # here evicts the pod several hours in, after calibration has been paid for.
    #
    # Why: GPTQ's Hessians are [in_features x in_features] fp32 per module, and
    # with offload_hessians they live in CPU memory on TOP of the shm-resident
    # model. One MoE layer of GLM-5.2 is 256 experts x (gate 144 + up 144 +
    # down 16 MiB) = 76 GiB per rank, and every rank accumulates over all
    # modules before the reduce, so 8 ranks = 608 GiB. Against the pod's
    # 1700 GiB memory limit (tmpfs is charged to the same cgroup):
    #     cpu=900e9  -> shm  838 + hess 608 + ws 150 = 1596 GiB  OK
    #     cpu=1350e9 -> shm 1257 + hess 608 + ws 150 = 2015 GiB  EVICTED
    # Max safe value here is ~1011 GB (1700 - 608 - 150); 900e9 keeps a real
    # margin. AWQ has no equivalent term -- its statistic is a ~24 KiB x_sum
    # per smooth-point on CPU, ~6000x smaller and not on the accelerator --
    # which is the entire reason it can afford 1350e9.
    #
    # See the AWQ config's max_memory block for the rest of the reasoning that
    # IS shared (why the budget is a cache and not a requirement, why GPUs
    # contribute no residency under auto_offload, and the load-time cephfs read
    # that no value here fixes).
    #
    # Requires dshm sizeLimit >= this in the Job template -- the tmpfs is the
    # real ceiling, and raising this alone does nothing.
    cpu: 900000000000
  # Rancher only now: the old SSH cluster's /mnt/nfs is gone. /mnt/cephfs is the
  # model-cache-shared PVC, the sole CA-region RWX storage. Scratch and output
  # sit under an owned top-level dir, NOT inside the tool-managed .hf-cache.
  offload_folder: /mnt/cephfs/hoangduy/offload/glm52-w4afp8-smoke

quantization:
  method: gptq
  scheme: W4AFP8
  ignore:
    - "lm_head"
    - "re:.*mlp[.]gate$"
    - "re:.*mlp[.]shared_experts[.].*"
    - "re:.*self_attn[.].*"
    - "re:.*layers[.][0-2][.].*"
    - "re:.*layers[.]78[.].*"
    # Restrict GPTQ to two sampled MoE layers: 3 (the first MoE layer, so the
    # dense->MoE boundary is exercised) and 42 (a mid-model 'full' layer
    # carrying indexer projections).
    - "re:.*model[.]layers[.](?!(?:3|42)(?:[.]|$))[0-9]+(?:[.]|$).*"
  fp8_dynamic_targets:
    - "re:.*model[.]layers[.](0|3)[.]self_attn[.](q_a_proj|q_b_proj|kv_a_proj_with_mqa|kv_b_proj|o_proj)$"
    - "re:.*model[.]layers[.]3[.]mlp[.]shared_experts[.](gate_proj|up_proj|down_proj)$"
    - "re:.*model[.]layers[.]0[.]mlp[.](gate_proj|up_proj|down_proj)$"
  gptq_dampening_frac: 0.01
  # REQUIRED on GLM-5.2. Run 20260827t105117z OOMed all four ranks here:
  #   CUDA out of memory. Tried to allocate 144.00 MiB. GPU 0 has a total
  #   capacity of 79.18 GiB ... 76.94 GiB is allocated by PyTorch
  #   at gptq/base.py:277 in calibrate_module
  # 76.94 GiB matches the predicted Hessian residency for ONE MoE layer:
  #   256 experts * [2*(6144^2) + 2048^2] * 4B = 76.0 GiB
  # and the failing 144 MiB request is exactly one gate/up_proj Hessian
  # (6144^2 * 4B). The figure was IDENTICAL on all four ranks, confirming that
  # peak Hessian residency does not scale down with world size: every rank
  # accumulates every targeted module's Hessian before
  # _reduce_hessian_to_target_rank frees non-owners. More GPUs will not fix it.
  #
  # This is a SMOKE-ONLY setting. offload_hessians round-trips the Hessian over
  # PCIe once per module per sample (the context manager wraps the accumulation
  # hook, not compression), which is ~3.6 TiB/layer at 8 samples but ~233
  # TiB/layer at the full run's 512. See gptq_offload_hessians in
  # pipeline/config.py. The full arm needs a different answer.
  gptq_offload_hessians: true
  sample_generation: false

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  # 32, up from 8. Raising samples is the main lever on runtime, because the
  # sequential pipeline propagates every sample through ALL 78 layers whether or
  # not they are quantized -- restricting the target layers does not reduce that.
  # It became affordable once the model went fully RAM-resident (max_memory.cpu
  # 900e9): at 32e9 the propagation read from a 31 MB/s PVC and 35 untargeted
  # layers cost 86 min at only 8 samples.
  #
  # 32 rather than the production 512 because the RAM-resident propagation rate
  # is not yet measured. Watch the first inter-layer gap and extrapolate before
  # raising it further.
  num_samples: 32
  max_seq_length: 512
  seed: 42
  moe_calibrate_all_experts: true
  sequential_targets: ["GlmMoeDsaDecoderLayer"]
  pipeline: sequential

serve:
  enabled: false

eval:
  enabled: false

output_dir: /mnt/cephfs/hoangduy/results/glm52-w4afp8-smoke
