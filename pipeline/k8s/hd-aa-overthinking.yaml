---
# Lotfi et al. 2026 overthinking labels on Sep-11 AA GPQA failures. CPU-only.
apiVersion: batch/v1
kind: Job
metadata:
  name: hd-aa-overthinking
  namespace: evaluation
  labels: {owner: hoangduy.dang, purpose: overthinking}
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels: {owner: hoangduy.dang, purpose: overthinking}
    spec:
      restartPolicy: Never
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      volumes:
        - name: cephfs
          persistentVolumeClaim: {claimName: model-cache-shared}
        - name: scripts
          configMap: {name: hd-aa-overthinking}
      containers:
        - name: screen
          image: lmsysorg/sglang:v0.5.17
          imagePullPolicy: IfNotPresent
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
          resources:
            requests: {cpu: "2", memory: "8Gi"}
            limits: {cpu: "4", memory: "16Gi"}
          volumeMounts:
            - {name: cephfs, mountPath: /mnt/cephfs}
            - {name: scripts, mountPath: /cm}
          command: ["bash", "-lc"]
          args:
            - |
              set -uo pipefail
              ROOT=/mnt/cephfs/hoangduy/results/glm53-quality-paired/20260902t0431z
              OURS=$ROOT/client-ours/aa-gpqa-v3/results-formal-198-c8/gpqa_diamond_aa_v3/cache/cache.sqlite/cache.db
              PHALA=$ROOT/client-phala/aa-gpqa-v3/results-formal-198-c8/gpqa_diamond_aa_v3/cache/cache.sqlite/cache.db
              mkdir -p /mnt/cephfs/hoangduy/runlogs /work/pipeline/evalsuite
              cp /cm/aa_overthinking.py /cm/aa_cap_loop_screen.py /cm/sample_output_check.py /work/pipeline/
              cp /cm/health.py /work/pipeline/evalsuite/
              : > /work/pipeline/__init__.py
              : > /work/pipeline/evalsuite/__init__.py
              export PYTHONPATH=/work
              LOG=/mnt/cephfs/hoangduy/runlogs/hd-aa-overthinking.log
              JSON=/mnt/cephfs/hoangduy/runlogs/hd-aa-overthinking.json
              exec > >(tee -a "$LOG") 2>&1
              echo "==> $(date -u +%FT%TZ)"
              python3 -m pipeline.aa_overthinking --json-out "$JSON" \
                --arm ours:"$OURS" --arm phala:"$PHALA"
              echo "==> done $(date -u +%FT%TZ)"
