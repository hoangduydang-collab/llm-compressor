# GLM-5.2 W4AFP8 smoke: first quantization run of ANY method on a family that
# is not MiniMax-M3, and the first exercise of the glm_moe_dsa linearize path
# added in 052cbec9. Layer-scoped so the run is self-documenting and cheap:
#
#   - GPTQ W4AFP8 routed experts : layers 3, 6, 42, 77
#   - FP8 MLA attention          : layers 0, 3, 6   (NOT the indexer)
#   - FP8 shared experts         : layers 3, 6
#   - FP8 dense MLP              : layer 0
#
# Layer choice is deliberate, not arbitrary:
#   - 3 is the first MoE layer (first_k_dense_replace = 3), 77 is the last, so
#     the eligibility gate is proven at both ends of the stack.
#   - Only 21 of the 78 layers are "full" and carry indexer projections at all;
#     from the released config's explicit `indexer_types`, those are 0, 1, 2,
#     then every 4th from 6 to 74. So 6 and 42 are full while 3 and 77 are
#     shared, and the indexer-exclusion invariant is proven on both kinds and on
#     both legs (layer 0 is full on the FP8 side, 3 and 6 cover both there).
#     Note 77 is NOT full — 74 is the last full layer.
#   - Layer 0 covers the dense GlmMoeDsaMLP path.
#
# An earlier revision used layers 3, 8, 40, 77 on the belief that 8 and 40 were
# full. They are not: all four were shared, so the GPTQ leg proved nothing about
# a full layer. The pattern must be read from `indexer_types` in the real
# config.json — deriving it from `index_topk_freq` yields a different list.
#
# Note where this DIVERGES from minimax_m3_distributed_r8_smoke.yaml's
# rationale: M3 included layer 0 to prove the save-side conversion of an
# FP8-quantized FUSED gate_up_proj (fused in memory, split on disk). GLM-5.2's
# dense and shared MLPs are unfused in both places, so that specific risk does
# not exist here and layer 0 earns its place for a different reason. Do not
# carry M3's justification across.
#
# What this smoke must prove before the full run spends the GPU budget:
#   1. glm_moe_dsa takes the fast direct-2D-load path (052cbec9) on a real
#      checkpoint, not just the CPU stand-in it was verified against.
#   2. The routed experts land as int4 g128 at `mlp.experts.N.{gate,up,down}_proj`.
#   3. All five MLA projections land FP8 and self_attn.indexer.* stays BF16, on
#      both a "full" and a "shared" indexer layer.
#   4. Save-side: get_linearize_load_mappings('glm_moe_dsa') returns THREE load
#      mappings and ZERO save mappings, so saving applies no inverse conversion.
#      That is believed correct — the linearized per-expert names are already
#      GLM's released checkpoint layout — but it means the save path is a no-op
#      rather than a tested transformation, unlike M3 (19 save mappings) or
#      DeepSeek-V4 (40). Verify the written keys, do not assume them.
#   5. The MTP layer is absent. Record whether layer 78 keys exist in the
#      output; they will not, and per BLOCKER 1 in the full config that is a
#      release blocker rather than a curiosity — Phala ships 2337 quantized
#      tensors there and production serves EAGLE off that head.
#
# Launch: the same distributed-quant launcher as the M3 smoke, METHODS=gptq
# EVIDENCE_ONLY=0.
name: glm52_distributed_w4afp8_smoke

model:
  # BLOCKED: not staged. Stage with HF_HUB_CACHE=/mnt/cephfs/.hf-cache so it
  # lands at .hf-cache/models--zai-org--GLM-5.2, matching the production prepull
  # convention; then this id resolves offline. 1.35 TiB. The FP8 release is
  # already staged at .hf-cache/models--zai-org--GLM-5.2-FP8 if we pick that
  # source instead (see BLOCKER 2).
  id: zai-org/GLM-5.2
  trust_remote_code: true
  auto_class: AutoModelForCausalLM
  dtype: bfloat16
  device_map: auto_offload
  max_memory:
    cpu: 32000000000
  # Rancher only now: the old SSH cluster's /mnt/nfs is gone. /mnt/cephfs is the
  # model-cache-shared PVC, the sole CA-region RWX storage. Scratch and output
  # sit under an owned top-level dir, NOT inside the tool-managed .hf-cache.
  offload_folder: /mnt/cephfs/hoangduy/offload/glm52-w4afp8-smoke

quantization:
  method: gptq
  scheme: W4AFP8
  ignore:
    - "lm_head"
    - "re:.*mlp[.]gate$"
    - "re:.*mlp[.]shared_experts[.].*"
    - "re:.*self_attn[.].*"
    - "re:.*layers[.][0-2][.].*"
    - "re:.*layers[.]78[.].*"
    # Restrict GPTQ to the four sampled MoE layers.
    - "re:.*model[.]layers[.](?!(?:3|6|42|77)(?:[.]|$))[0-9]+(?:[.]|$).*"
  fp8_dynamic_targets:
    - "re:.*model[.]layers[.](0|3|6)[.]self_attn[.](q_a_proj|q_b_proj|kv_a_proj_with_mqa|kv_b_proj|o_proj)$"
    - "re:.*model[.]layers[.](3|6)[.]mlp[.]shared_experts[.](gate_proj|up_proj|down_proj)$"
    - "re:.*model[.]layers[.]0[.]mlp[.](gate_proj|up_proj|down_proj)$"
  gptq_dampening_frac: 0.01
  sample_generation: false

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  num_samples: 8
  max_seq_length: 512
  seed: 42
  moe_calibrate_all_experts: true
  sequential_targets: ["GlmMoeDsaDecoderLayer"]
  pipeline: sequential

serve:
  enabled: false

eval:
  enabled: false

output_dir: /mnt/cephfs/hoangduy/results/glm52-w4afp8-smoke
