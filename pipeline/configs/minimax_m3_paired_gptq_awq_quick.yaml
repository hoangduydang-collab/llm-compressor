schema_version: 1
name: minimax-m3-paired-gptq-vs-cyankiwi-quick
# QUICK (~1-2h) paired comparison: repaired in-house GPTQ vs cyankiwi AWQ.
# Identical to minimax_m3_paired_gptq_awq.yaml but every task is stratified-
# subsampled to `sampling.production_samples_per_task` via the seeded manifest
# (both models see identical indices, so the paired McNemar stays exact). This
# is a sanity-level signal, NOT the definitive eval -- per-task n is small, so
# treat deltas as directional and the gates as advisory. Run the full config
# (minimax_m3_paired_gptq_awq.yaml) for the final verdict.
backend: vllm
baseline_label: cyankiwi_awq
model_source: /mnt/nfs/hoangduy/hf_assets/MiniMaxAI/MiniMax-M3
eval_config: pipeline/configs/eval_minimax_m3_quality.yaml

models:
  - label: cyankiwi_awq
    path: /mnt/nfs/hoangduy/hf_assets/cyankiwi/MiniMax-M3-AWQ-INT4
    kind: awq-w4a16
    nodes: 1
    tensor_parallel_size: 8
    distributed_executor_backend: mp
  - label: inhouse_gptq
    path: /mnt/nfs/hoangduy/projects/llm-compressor/artifacts/m3-awq-gptq-prepared/gptq-checkpoint-vllm-w123
    kind: gptq-w4a8
    nodes: 1
    tensor_parallel_size: 8
    distributed_executor_backend: mp

shards:
  - name: reasoning
    tasks: [gpqa_diamond, ifeval, aime_2025]
    distributional_probe: false
  - name: broad
    tasks: [mmlu_pro, gsm8k]
    distributional_probe: true

task_aliases:
  gpqa_diamond: [gpqa_diamond_zeroshot, gpqa_diamond, leaderboard_gpqa]
  ifeval: [ifeval, leaderboard_ifeval]
  aime_2025: [aime25, aime_2025]
  mmlu_pro: [mmlu_pro, leaderboard_mmlu_pro]
  gsm8k: [gsm8k]

sampling:
  seed: 42
  mmlu_pro_samples: 100
  # Quick-eval knob: cap EVERY task to this many stratified samples. Lower it to
  # ~50 if the first-arm timing projects past ~2h; raise it for more signal.
  production_samples_per_task: 100

probe:
  total_tokens: 8192
  top_k: 20
  max_overhead_seconds: 900

gates:
  max_task_drop: 0.02
  min_macro_recovery: 0.98
  max_conditional_regression: 0.05
  max_perplexity_increase: 0.10
  max_degeneration_failures: 0
