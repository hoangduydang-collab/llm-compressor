# GLM-5.2-W4AFP8 — gsm8k CoT capability run (thinking instruct harness).
#
# Re-run gsm8k after the original 8k static suite under-reported scores on
# thinking models (missing fewshot_as_multiturn + think_end_token strip).
#
# This is NOT a leaderboard-identical gsm8k config: max_gen_toks is raised to
# 4096 so GLM-5.2 can finish CoT before writing #### <answer>. Comparable to
# third-party CoT gsm8k reports that use chat template + thinking strip.
#
# For HF Open LLM Leaderboard v2 BBH, use eval_glm52_w4afp8_leaderboard_bbh.yaml
# (leaderboard_bbh, multichoice acc_norm — incompatible with enable_thinking).
#
# Harness:
#   - apply_chat_template + fewshot_as_multiturn
#   - enable_thinking + think_end_token (GLM-5.2 </think>)
#   - greedy generation with max_gen_toks=4096 for long CoT
#
# Requires lm-eval >= c1c4bea in sglang-eval venv (see pipeline/README.md).
#
# Run (cluster):
#   source /mnt/nfs/hoangduy/env.sh
#   source /mnt/nfs/hoangduy/venvs/sglang-eval/bin/activate
#   cd /mnt/nfs/hoangduy/projects/llm-compressor && git pull
#
#   CONFIG=pipeline/configs/eval_glm52_w4afp8_sglang_gen_standard.yaml \
#   OUT_DIR=evals/glm52-w4afp8-gsm8k-cot \
#     bash pipeline/slurm/run_eval_glm52_sglang_detached.sh
#
# Compare to prior run:
#   python -m pipeline.evalsuite.cli compare \
#     --a evals/glm52-w4afp8-phala-8k --b evals/glm52-w4afp8-gsm8k-cot \
#     --out evals/compare-8k-vs-gsm8k-cot \
#     --config pipeline/configs/eval_glm52_w4afp8_sglang_gen_standard.yaml \
#     --label-a harness-old --label-b gsm8k-cot

name: eval-glm52-w4afp8-sglang-gen-standard

model:
  id: /mnt/nfs/hoangduy/hf_assets/PhalaCloud/GLM-5.2-W4AFP8
  trust_remote_code: true

serve:
  tensor_parallel_size: 8
  max_model_len: 8192
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  sglang_compat_fallbacks: true
  sglang_kwargs:
    quantization: w4afp8
    disable_shared_experts_fusion: true
    max_total_tokens: 32768
    chunked_prefill_size: 512
    max_running_requests: 4

eval:
  enabled: true
  log_samples: true
  backend: sglang
  lm_eval_batch_size: 8
  apply_chat_template: true
  fewshot_as_multiturn: true
  enable_thinking: true
  think_end_token: "</think>"
  gen_kwargs:
    max_gen_toks: 4096
  baseline: null
  tasks:
    - name: gsm8k
      metric: exact_match,strict-match
      num_fewshot: 5
      limit: null

agentic:
  enabled: false

quantization:
  method: gptq
  scheme: W4AFP8
