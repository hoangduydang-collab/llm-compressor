# Stage 1 - small-MoE real run (the M1 smoke target, Qwen3-30B-A3B).
# Base config = GPTQ x W4AFP8. Sweep the 4 M1 cells with --set:
#   python -m pipeline.run --config pipeline/configs/qwen3_30b_a3b.yaml
#   ... --set quantization.scheme=W4A8
#   ... --set quantization.method=awq
#   ... --set quantization.method=awq --set quantization.scheme=W4A8
#
# Produce the BF16 baseline first (one-time), then point eval.baseline at it:
#   python -m pipeline.run --config pipeline/configs/qwen3_30b_a3b.yaml \
#       --make-baseline artifacts/qwen3-30b-a3b-baseline.json
name: qwen3_30b_a3b

model:
  id: Qwen/Qwen3-30B-A3B
  trust_remote_code: false
  dtype: auto

quantization:
  method: gptq            # gptq | awq | smoothquant+gptq | smoothquant+awq
  scheme: W4AFP8          # W4AFP8 | W4A8
  # vLLM does not support asymmetric MoE; presets here are symmetric.
  ignore: ["lm_head", "re:.*mlp.gate$"]

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  num_samples: 512
  max_seq_length: 2048
  moe_calibrate_all_experts: true

serve:
  enabled: true
  tensor_parallel_size: 2
  enable_expert_parallel: true
  max_model_len: 4096
  gpu_memory_utilization: 0.9
  prompt: "The capital of France is"

eval:
  enabled: true
  baseline: null          # set to the --make-baseline output to gate
  recovery_threshold: 0.94
  max_ppl_increase: 0.10
  # tasks: default 8-task full suite (wikitext, mmlu, arc_challenge, hellaswag,
  # winogrande, gsm8k, truthfulqa_mc2, bbh) — see full_static_tasks() in config.py

# tau2 agentic eval (off by default; enable with --agentic or agentic.enabled: true).
# Requires vLLM serving the checkpoint at agent_base before eval.
agentic:
  enabled: false
  harness: tau2
  tau2_dir: /mnt/nfs/hoangduy/tau2-bench
  calibration_script: null
  domain: mock              # smoke: mock; production: telecom
  split: small
  num_tasks: 1              # smoke: 1; production: null (full split)
  max_conc: 1
  num_trials: 1
  thinking: off
  agent_base: http://localhost:8000/v1
  agent_model: null         # defaults to model.id at runtime
  user_base: https://api-inference.bitdeer.ai/v1
  user_model: deepseek-ai/DeepSeek-V3.2
  user_key_file: /mnt/nfs/hoangduy/.bitdeer_key
  save_to: evalsuite_agentic

output_dir: ./artifacts
