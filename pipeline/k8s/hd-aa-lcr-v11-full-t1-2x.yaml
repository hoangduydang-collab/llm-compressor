apiVersion: batch/v1
kind: Job
metadata:
  generateName: hd-aa-lcr-v11-full-t1p95-2x-
  namespace: evaluation
  labels:
    owner: hoangduy.dang
    purpose: aa-lcr-v11-full-t1p95-2x
    aa-lcr-run-id: glm53-w4afp8-aa-lcr-v11-full-t1p95-2x-r1
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  # 48h, not the 24h of the 131k Jobs: doubling the cap roughly doubles the
  # generated-token volume, and the admission gate serialises the long tail.
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        owner: hoangduy.dang
        purpose: aa-lcr-v11-full-t1p95-2x
        aa-lcr-run-id: glm53-w4afp8-aa-lcr-v11-full-t1p95-2x-r1
    spec:
      restartPolicy: Never
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: evaluate
          image: python:3.12-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: TIKTOKEN_CACHE_DIR, value: "/mnt/cephfs/hoangduy/cache/aa-lcr-v11-tiktoken"}
            - {name: CL100K_CACHE_FILE, value: "9b5ad71b2ce5302211f9c61530b329a4922fc6a4"}
            - {name: CL100K_BPE_SHA256, value: "223921b76ee99bde995b7ff738513eef100fb51d18c93597a113bcffe865b2a7"}
            - {name: TIKTOKEN_READY_MARKER, value: "/mnt/cephfs/hoangduy/cache/aa-lcr-v11-tiktoken/cl100k_base.ready"}
            - {name: CANDIDATE_COMPLETIONS_URL, value: "http://glm-5-3-w4afp8-sglang:30000/v1/chat/completions"}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: hd-openai-aa-judge, key: OPENAI_API_KEY}
            - name: AA_LCR_CODE_REVISION
              valueFrom:
                configMapKeyRef:
                  name: AA_LCR_CODE_CONFIGMAP
                  key: AA_LCR_CODE_REVISION
          resources:
            requests: {cpu: "2", memory: "8Gi"}
            limits: {cpu: "4", memory: "16Gi"}
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /mnt/cephfs/hoangduy/runlogs
              exec > >(tee -a /mnt/cephfs/hoangduy/runlogs/hd-aa-lcr-v11-full-t1p95-2x.log) 2>&1
              LOCK=/workspace/pipeline/requirements-aa-lcr-v11.lock
              DIGEST=$(sha256sum "$LOCK" | awk '{print $1}')
              VENV=/mnt/cephfs/hoangduy/venvs/aa-lcr-v11-py312-${DIGEST:0:12}
              test -x "$VENV/bin/python"
              test "$(cat "$VENV/requirements-sha256.txt")" = "$DIGEST"
              test -d "$TIKTOKEN_CACHE_DIR"
              test -s "$TIKTOKEN_CACHE_DIR/$CL100K_CACHE_FILE"
              test -s "$TIKTOKEN_READY_MARKER"
              test "$(cat "$TIKTOKEN_READY_MARKER")" = "$CL100K_CACHE_FILE $CL100K_BPE_SHA256"
              test "$(sha256sum "$TIKTOKEN_CACHE_DIR/$CL100K_CACHE_FILE" | awk '{print $1}')" = "$CL100K_BPE_SHA256"
              cd /workspace
              "$VENV/bin/python" -m pipeline.aa_lcr_v11 run \
                --run-id glm53-w4afp8-aa-lcr-v11-full-t1p95-2x-r1 \
                --work-dir /mnt/cephfs/hoangduy/aa-lcr-v11-work \
                --output-dir /mnt/cephfs/hoangduy/results/glm53-aa-lcr-v11 \
                --candidate-base-url "${CANDIDATE_COMPLETIONS_URL%/v1/chat/completions}" \
                --candidate-temperature 1.0 \
                --candidate-top-p 0.95 \
                --candidate-max-tokens 262144 \
                --limit 100 --repeats 3 \
                --candidate-concurrency 2 \
                --candidate-long-attempt-seconds 900 --judge-preflight
          volumeMounts:
            - {name: cephfs, mountPath: /mnt/cephfs}
            - {name: code, mountPath: /workspace/pipeline, readOnly: true}
      volumes:
        - name: cephfs
          persistentVolumeClaim: {claimName: model-cache-shared}
        - name: code
          configMap: {name: AA_LCR_CODE_CONFIGMAP}
