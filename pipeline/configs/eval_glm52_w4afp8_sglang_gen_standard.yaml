# GLM-5.2-W4AFP8 — generation tasks with lm-eval standard instruct harness.
#
# Use this to re-run gsm8k/bbh after the original 8k static suite under-reported
# scores on thinking models (missing fewshot_as_multiturn + think_end_token strip).
#
# Harness (lm-eval / Open LLM Leaderboard style for instruct models):
#   - apply_chat_template + fewshot_as_multiturn
#   - enable_thinking + think_end_token (GLM-5.2 </think>)
#   - greedy generation (task default) with higher max_gen_toks for CoT
#
# Run (cluster):
#   source /mnt/nfs/hoangduy/env.sh
#   source /mnt/nfs/hoangduy/venvs/sglang-eval/bin/activate
#   cd /mnt/nfs/hoangduy/projects/llm-compressor && git pull
#
#   CONFIG=pipeline/configs/eval_glm52_w4afp8_sglang_gen_standard.yaml \
#   OUT_DIR=evals/glm52-w4afp8-phala-8k-gen-standard \
#     bash pipeline/slurm/run_eval_glm52_sglang_detached.sh
#
# Compare to prior run:
#   python -m pipeline.evalsuite.cli compare \
#     --a evals/glm52-w4afp8-phala-8k --b evals/glm52-w4afp8-phala-8k-gen-standard \
#     --out evals/compare-8k-vs-gen-standard \
#     --config pipeline/configs/eval_glm52_w4afp8_sglang_gen_standard.yaml \
#     --label-a harness-old --label-b harness-standard

name: eval-glm52-w4afp8-sglang-gen-standard

model:
  id: /mnt/nfs/hoangduy/hf_assets/PhalaCloud/GLM-5.2-W4AFP8
  trust_remote_code: true

serve:
  tensor_parallel_size: 8
  # 8k is enough for gsm8k/bbh; matches original static suite context cap.
  max_model_len: 8192
  # Phala-like mem fraction (H200 card uses 0.85; H100 8k suite used 0.72).
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8_e4m3
  sglang_compat_fallbacks: true
  sglang_kwargs:
    quantization: w4afp8
    disable_shared_experts_fusion: true
    max_total_tokens: 32768
    chunked_prefill_size: 512
    max_running_requests: 4

eval:
  enabled: true
  log_samples: true
  backend: sglang
  lm_eval_batch_size: 8
  apply_chat_template: true
  fewshot_as_multiturn: true
  enable_thinking: true
  # GLM-5.2 chat template (zai-org/GLM-5.2 chat_template.jinja).
  think_end_token: "</think>"
  gen_kwargs:
    max_gen_toks: 4096
  baseline: null
  tasks:
    - name: gsm8k
      metric: exact_match,strict-match
      num_fewshot: 5
      limit: null
    - name: bbh
      metric: exact_match,get-answer
      num_fewshot: 3
      limit: null

agentic:
  enabled: false

quantization:
  method: gptq
  scheme: W4AFP8
