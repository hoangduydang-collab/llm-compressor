# r8a full: distributed AWQ W4AFP8 on routed experts (r6 recipe, no up->down
# fold) + FP8_DYNAMIC (W8A8) on attention / shared experts / dense MLPs,
# quantized from source BF16. AWQ analog of minimax_m3_distributed_r8_full.yaml
# (see that file for the bandwidth motivation) cloned from
# minimax_m3_distributed_awq_full.yaml. The int4 ignore list is UNCHANGED —
# the FP8 modifier owns attention/shared/dense via explicit targets (disjoint
# sets); the attention indexer stays BF16 by design. Launch through
# run_m3_distributed_quant_smoke_srun.sh with METHODS=awq EVIDENCE_ONLY=0,
# after minimax_m3_distributed_r8a_awq_smoke.yaml passes its gates (fold/FP8
# ordering — the smooth-fold audit on dequantized shared witnesses).
name: minimax_m3_distributed_r8a_awq_full

model:
  id: MiniMaxAI/MiniMax-M3
  trust_remote_code: true
  auto_class: AutoModelForImageTextToText
  dtype: bfloat16
  device_map: auto_offload
  # See minimax_m3_distributed_awq_full.yaml for the small-cpu-budget
  # rationale (shm VMA exhaustion; bulk weights go to DistributedDiskCache).
  max_memory:
    cpu: 32000000000
  offload_folder: /mnt/nfs/hoangduy/offload/m3-distributed-r8a-full

quantization:
  method: awq
  scheme: W4AFP8
  ignore:
    - "lm_head"
    - "re:.*vision_tower.*"
    - "re:.*multi_modal_projector.*"
    - "re:.*patch_merge_mlp.*"
    - "re:.*mlp[.]gate$"
    - "re:.*block_sparse_moe[.]gate$"
    - "re:.*mlp[.]shared_experts[.].*"
    - "re:.*block_sparse_moe[.]shared_experts[.].*"
    - "re:.*self_attn[.].*"
    - "re:.*layers[.][0-2][.].*"
  fp8_dynamic_targets:
    - "re:.*language_model[.]layers[.][0-9]+[.]self_attn[.](q|k|v|o)_proj$"
    - "re:.*language_model[.]layers[.][0-9]+[.]mlp[.]shared_experts[.](gate_up_proj|down_proj)$"
    - "re:.*language_model[.]layers[.][0-2][.]mlp[.](gate_up_proj|down_proj)$"
  sample_generation: false

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  num_samples: 512
  max_seq_length: 2048
  seed: 42
  moe_calibrate_all_experts: true
  sequential_targets: ["MiniMaxM3VLDecoderLayer"]
  pipeline: sequential

serve:
  enabled: false

eval:
  enabled: false

output_dir: /mnt/nfs/hoangduy/results/m3-distributed-r8a-full
