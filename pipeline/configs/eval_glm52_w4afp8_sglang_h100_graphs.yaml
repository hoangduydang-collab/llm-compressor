# GLM-5.2-W4AFP8 eval on 8x H100 80GB — CUDA graphs ON, minimal KV pool.
#
# Keeps KV tiny (max_total_tokens=8192) so graph capture fits after weights.
# Requires DeepGEMM precompiled (nvcc 12.9 in env.sh). Expect ~10 min graph
# capture at startup, then much faster loglikelihood than graphs-off config.
#
#   python -m pipeline.evalsuite.cli run \
#     --config pipeline/configs/eval_glm52_w4afp8_sglang_h100_graphs.yaml \
#     --out evals/glm52-w4afp8-phala
#
# If graph capture OOMs, lower gpu_memory_utilization to 0.65 or max_total_tokens
# to 4096, or use eval_glm52_w4afp8_sglang_h100.yaml (graphs off).

name: eval-glm52-w4afp8-sglang-h100-graphs

model:
  id: /mnt/nfs/hoangduy/hf_assets/PhalaCloud/GLM-5.2-W4AFP8
  trust_remote_code: true

serve:
  tensor_parallel_size: 8
  max_model_len: 2048
  gpu_memory_utilization: 0.68
  kv_cache_dtype: fp8_e4m3
  sglang_compat_fallbacks: true
  sglang_kwargs:
    quantization: w4afp8
    disable_shared_experts_fusion: true
    max_total_tokens: 8192
    chunked_prefill_size: 1024
    max_running_requests: 1

eval:
  enabled: true
  log_samples: true
  backend: sglang
  apply_chat_template: true
  baseline: null
  tasks:
    - name: wikitext
      metric: word_perplexity,none
      higher_is_better: false
      num_fewshot: 0
      limit: null
    - name: mmlu
      metric: acc,none
      num_fewshot: 5
      limit: null
    - name: arc_challenge
      metric: acc_norm,none
      num_fewshot: 25
      limit: null
    - name: hellaswag
      metric: acc_norm,none
      num_fewshot: 10
      limit: null
    - name: winogrande
      metric: acc,none
      num_fewshot: 5
      limit: null
    - name: gsm8k
      metric: exact_match,strict-match
      num_fewshot: 5
      limit: null
    - name: truthfulqa_mc2
      metric: acc,none
      num_fewshot: 0
      limit: null
    - name: bbh
      metric: exact_match,get-answer
      num_fewshot: 3
      limit: null

agentic:
  enabled: false

quantization:
  method: gptq
  scheme: W4AFP8
