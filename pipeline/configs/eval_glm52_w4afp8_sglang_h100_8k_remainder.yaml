# Resume GLM-5.2 8k eval after gsm8k crash (lm-eval max_tokens fixed in 0.4.13.dev0).
# With per-task checkpointing, re-run the FULL config into the same OUT_DIR;
# tasks already in aggregate.json are skipped automatically.
#
#   source /mnt/nfs/hoangduy/env.sh
#   source /mnt/nfs/hoangduy/venvs/sglang-eval/bin/activate
#   cd /mnt/nfs/hoangduy/projects/llm-compressor && git pull
#   pkill -9 -f 'pipeline.evalsuite|sglang::' || true
#   rm -f evals/glm52-w4afp8-phala-8k/eval.pid
#
#   CONFIG=pipeline/configs/eval_glm52_w4afp8_sglang_h100_8k.yaml \
#   OUT_DIR=evals/glm52-w4afp8-phala-8k \
#     bash pipeline/slurm/run_eval_glm52_sglang_detached.sh
#
# Or run only remaining tasks (if you have no aggregate.json yet):
#   CONFIG=pipeline/configs/eval_glm52_w4afp8_sglang_h100_8k_remainder.yaml \
#   OUT_DIR=evals/glm52-w4afp8-phala-8k-remainder \
#     bash pipeline/slurm/run_eval_glm52_sglang_detached.sh

name: eval-glm52-w4afp8-sglang-h100-8k-remainder

model:
  id: /mnt/nfs/hoangduy/hf_assets/PhalaCloud/GLM-5.2-W4AFP8
  trust_remote_code: true

serve:
  tensor_parallel_size: 8
  max_model_len: 8192
  gpu_memory_utilization: 0.72
  kv_cache_dtype: fp8_e4m3
  sglang_compat_fallbacks: true
  sglang_kwargs:
    quantization: w4afp8
    disable_shared_experts_fusion: true
    max_total_tokens: 32768
    chunked_prefill_size: 512
    max_running_requests: 4

eval:
  enabled: true
  log_samples: true
  backend: sglang
  lm_eval_batch_size: 8
  apply_chat_template: true
  baseline: null
  tasks:
    - name: gsm8k
      metric: exact_match,strict-match
      num_fewshot: 5
      limit: null
    - name: truthfulqa_mc2
      metric: acc,none
      num_fewshot: 0
      limit: null
    - name: bbh
      metric: exact_match,get-answer
      num_fewshot: 3
      limit: null

agentic:
  enabled: false

quantization:
  method: gptq
  scheme: W4AFP8
