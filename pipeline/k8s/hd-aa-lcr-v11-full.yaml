apiVersion: batch/v1
kind: Job
metadata:
  generateName: hd-aa-lcr-v11-full-
  namespace: evaluation
  labels:
    owner: hoangduy.dang
    purpose: aa-lcr-v11-full
    aa-lcr-run-id: glm53-w4afp8-aa-lcr-v11-full-r1
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        owner: hoangduy.dang
        purpose: aa-lcr-v11-full
        aa-lcr-run-id: glm53-w4afp8-aa-lcr-v11-full-r1
    spec:
      restartPolicy: Never
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: evaluate
          image: python:3.12-slim
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: CANDIDATE_COMPLETIONS_URL, value: "http://glm-5-3-w4afp8-sglang:30000/v1/chat/completions"}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: hd-openai-aa-judge, key: OPENAI_API_KEY}
            - name: AA_LCR_CODE_REVISION
              valueFrom:
                configMapKeyRef:
                  name: AA_LCR_CODE_CONFIGMAP
                  key: AA_LCR_CODE_REVISION
          resources:
            requests: {cpu: "2", memory: "8Gi"}
            limits: {cpu: "4", memory: "16Gi"}
          command: ["bash", "-lc"]
          args:
            - |
              set -euo pipefail
              mkdir -p /mnt/cephfs/hoangduy/runlogs
              exec > >(tee -a /mnt/cephfs/hoangduy/runlogs/hd-aa-lcr-v11-full.log) 2>&1
              LOCK=/workspace/pipeline/requirements-aa-lcr-v11.lock
              DIGEST=$(sha256sum "$LOCK" | awk '{print $1}')
              VENV=/mnt/cephfs/hoangduy/venvs/aa-lcr-v11-py312-${DIGEST:0:12}
              test -x "$VENV/bin/python"
              test "$(cat "$VENV/requirements-sha256.txt")" = "$DIGEST"
              cd /workspace
              "$VENV/bin/python" -m pipeline.aa_lcr_v11 run \
                --run-id glm53-w4afp8-aa-lcr-v11-full-r1 \
                --work-dir /mnt/cephfs/hoangduy/aa-lcr-v11-work \
                --output-dir /mnt/cephfs/hoangduy/results/glm53-aa-lcr-v11 \
                --candidate-base-url "${CANDIDATE_COMPLETIONS_URL%/v1/chat/completions}" \
                --limit 100 --repeats 3 --candidate-concurrency 2 --judge-preflight
          volumeMounts:
            - {name: cephfs, mountPath: /mnt/cephfs}
            - {name: code, mountPath: /workspace/pipeline, readOnly: true}
      volumes:
        - name: cephfs
          persistentVolumeClaim: {claimName: model-cache-shared}
        - name: code
          configMap: {name: AA_LCR_CODE_CONFIGMAP}
