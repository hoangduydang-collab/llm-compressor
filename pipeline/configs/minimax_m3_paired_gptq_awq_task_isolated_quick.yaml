schema_version: 1
name: minimax-m3-paired-gptq-vs-cyankiwi-task-isolated-quick
# Directional paired comparison with two task groups plus one probe per model.
# Tasks in each group share one model load and checkpoint independently.
backend: vllm
baseline_label: cyankiwi_awq
model_source: /mnt/nfs/hoangduy/hf_assets/MiniMaxAI/MiniMax-M3
eval_config: pipeline/configs/eval_minimax_m3_quality.yaml

models:
  - label: cyankiwi_awq
    path: /mnt/nfs/hoangduy/hf_assets/cyankiwi/MiniMax-M3-AWQ-INT4
    kind: awq-w4a16
    nodes: 1
    tensor_parallel_size: 8
    distributed_executor_backend: mp
  - label: inhouse_gptq
    path: /mnt/nfs/hoangduy/projects/llm-compressor/artifacts/m3-awq-gptq-prepared/gptq-checkpoint-vllm-w123-abi-overlay
    kind: gptq-w4a8
    nodes: 1
    tensor_parallel_size: 8
    distributed_executor_backend: mp

shards:
  - name: reasoning
    tasks: [gpqa_diamond, ifeval]
    distributional_probe: false
  - name: broad_math
    tasks: [mmlu_pro, gsm8k, aime_2025]
    distributional_probe: false
  - name: distributional_probe
    tasks: []
    distributional_probe: true

task_aliases:
  gpqa_diamond: [gpqa_diamond_zeroshot, gpqa_diamond, leaderboard_gpqa]
  ifeval: [ifeval, leaderboard_ifeval]
  aime_2025: [aime25, aime_2025]
  mmlu_pro: [mmlu_pro, leaderboard_mmlu_pro]
  gsm8k: [gsm8k]

sampling:
  seed: 42
  mmlu_pro_samples: 100
  production_samples_per_task: 100

scheduling:
  max_parallel_arms: 6
  arm_time_limit: "16:00:00"

probe:
  total_tokens: 8192
  top_k: 20
  max_overhead_seconds: 900

gates:
  max_task_drop: 0.02
  min_macro_recovery: 0.98
  max_conditional_regression: 0.05
  max_perplexity_increase: 0.10
  max_degeneration_failures: 0
