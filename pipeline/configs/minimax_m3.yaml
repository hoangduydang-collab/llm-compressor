# Stage 4 - MiniMax-M3 candidate checkpoints (experts-only INT4 weights + FP8 acts).
#
# PREREQUISITE (Stage 3): confirm M3 MoE linearization works (see
# pipeline/README.md "MiniMax-M3 enablement").
#
# SCHEME RATIONALE (WEIGHT quant borrowed from reputable MiniMax-M3 4-bit
# practice; ACTIVATION quant is our own choice -- the two are independent. See
# .cursor/rules/quantization-what-to-quantize.mdc + BUGS_AND_FIXES.md):
# WEIGHTS: every reputable M3 4-bit checkpoint quantizes ONLY the routed MoE
# expert projections (gate/up/down_proj) to INT4 and keeps ATTENTION HIGH-PRECISION:
#   - spectator2026/MiniMax-M3-AWQ-int4  (llm-compressor recipe.yaml): experts-only
#     INT4 g128, attention/router/shared/dense/lm_head/vision all high-precision.
#   - brandonmusic/MiniMax-M3-NVFP4:      routed experts 4-bit, attention BF16 (all 60 layers).
#   - mratsim/MiniMax-M2.1-FP8-INT4-AWQ:  experts INT4, self-attn FP8.
# We adopt that WEIGHT contract (experts-only INT4, attention out of `ignore`).
# ACTIVATIONS: we keep FP8 dynamic per-token activations (W4AFP8) rather than the
# community weight-only (A16) default -- FP8 acts only apply to the quantized
# modules (the experts); attention is ignored so it stays BF16 regardless.
# The previous W4AFP8 recipe also quantized self_attn q/k/v/o to INT4 (attention
# was NOT in `ignore`) -> NaN at first quantized attention layer -> "arringarring..."
# garbage. Fix = exclude attention; activations stay FP8.
#
#   python -m pipeline.run --config pipeline/configs/minimax_m3.yaml
name: minimax_m3

model:
  id: MiniMaxAI/MiniMax-M3
  trust_remote_code: true
  # M3 is a VL (image-text-to-text) MoE; load the full model so the language
  # backbone is quantized while the vision tower is kept (ignored) and saved.
  auto_class: AutoModelForImageTextToText
  dtype: bfloat16
  # ~428B params: load to CPU/disk and let the sequential pipeline onload
  # one decoder layer at a time onto the GPU during calibration.
  device_map: null
  # For nodes with limited CPU RAM, switch to disk offload:
  # device_map: auto_offload
  # offload_folder: ./offload
  # max_memory: {cpu: 500e9}

quantization:
  method: awq             # sweep awq | gptq | smoothquant+awq
  # W4AFP8 = INT4 weights (borrowed from community experts-only recipe) + FP8
  # dynamic per-token activations (our choice; independent of the weight scheme).
  # Applies only to the routed experts; attention is ignored below and stays BF16.
  scheme: W4AFP8
  # Module paths verified against transformers 5.12.1 modeling_minimax_m3_vl.py.
  # Experts (MiniMaxM3VLExperts) carry @use_experts_implementation -> they
  # auto-linearize; no custom MoE calibration module is needed.
  # After the ignore list below, the ONLY quantized Linears are the routed MoE
  # experts (mlp.experts.*.{gate,up,down}_proj) in layers 3-59 -- experts-only,
  # matching best-practice M3 4-bit checkpoints.
  ignore:
    - "lm_head"
    - "re:.*vision_tower.*"
    - "re:.*multi_modal_projector.*"
    - "re:.*patch_merge_mlp.*"
    - "re:.*mlp[.]gate$"                 # MoE router
    - "re:.*mlp[.]shared_experts[.].*"   # shared experts
    - "re:.*block_sparse_moe[.]shared_experts[.].*" # vLLM shared-expert alias
    - "re:.*self_attn[.].*"               # ATTENTION q/k/v/o + MSA indexer: keep BF16
    - "re:.*layers[.][0-2][.].*"          # first 3 dense/full-attn layers
  # 428B model calibrates offloaded (CPU/disk); autoregressive generation is ~minutes
  # per token. Skip the post-quant sanity gen and validate via serve_verify instead.
  sample_generation: false

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  # SMOKE settings: tiny calibration to validate the full pipeline end-to-end
  # (load -> linearize -> FX trace -> quantize -> save) quickly. For production
  # calibration use pipeline/configs/minimax_m3_full_calib.yaml (512 x 2048):
  #   bash pipeline/slurm/run_quantize_minimax_m3_full_calib.sh
  num_samples: 8
  max_seq_length: 512
  moe_calibrate_all_experts: true
  # Onload one decoder layer at a time during calibration (428B model).
  sequential_targets: ["MiniMaxM3VLDecoderLayer"]

serve:
  enabled: true
  tensor_parallel_size: 8
  enable_expert_parallel: true
  block_size: 128            # MSA sparse block size; defaults fail KV init
  kv_cache_dtype: fp8
  max_model_len: 32768
  gpu_memory_utilization: 0.9
  # CUDA graphs on by default. FlashInfer fused AR is skipped during capture via
  # patch_vllm_m3_serve.py (NCCL fallback). ENFORCE_EAGER=1 if graph capture fails.
  enforce_eager: false
  # vLLM's custom (P2P/IPC) all-reduce deadlocks on this 2x4 H100 topology: all 8
  # workers hang in custom_all_reduce.py at the FIRST TP collective (the vocab
  # embedding all_reduce in VocabParallelEmbedding.forward), which surfaces as the
  # decode-time "No available shared memory broadcast block found in 60s" ->
  # sample_tokens timeout. Route TP all-reduce through NCCL instead. See
  # BUGS_AND_FIXES.md ("custom all-reduce deadlock").
  disable_custom_all_reduce: true
  prompt: "The capital of France is"
  # The HTTP server additionally needs (not used by offline serve-verify):
  #   --tool-call-parser minimax_m3 --reasoning-parser minimax_m3
  #   --enable-auto-tool-choice --trust-remote-code
  extra_args:
    - "--tool-call-parser=minimax_m3"
    - "--reasoning-parser=minimax_m3"
    - "--enable-auto-tool-choice"

eval:
  enabled: true
  baseline: null            # point at the BF16/MXFP8 M3 baseline metrics JSON
  recovery_threshold: 0.94
  max_ppl_increase: 0.10
  # tasks: default 8-task full suite — see full_static_tasks() in config.py

output_dir: ./artifacts
