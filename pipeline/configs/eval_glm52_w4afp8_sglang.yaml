# Full static eval for PhalaCloud/GLM-5.2-W4AFP8 (SGLang-native w4afp8 layout).
#
# Requires: SGLang >= 0.5.13.post1, 8x Hopper GPUs, lm-eval sglang backend.
#
# Memory notes:
#   - Phala validated on 8x H200 (140GB). On 8x H100 (80GB) weights ~76GB/GPU;
#     disable CUDA graphs and lower mem_fraction_static to fit.
#   - venv: install sglang FIRST (pins torch 2.11 + flashinfer 0.6.12). Do NOT
#     pip install -e llm-compressor into the same venv (pulls torch 2.12 and
#     breaks FlashInfer CuTe kernels). Use PYTHONPATH for the pipeline module.
#   - Prefer an H200 node if available; use eval_glm52_w4afp8_sglang_h200.yaml there.
#
#   python -m pipeline.evalsuite.cli run \
#     --config pipeline/configs/eval_glm52_w4afp8_sglang.yaml \
#     --out evals/glm52-w4afp8-phala

name: eval-glm52-w4afp8-sglang

model:
  id: /mnt/nfs/hoangduy/hf_assets/PhalaCloud/GLM-5.2-W4AFP8
  trust_remote_code: true

serve:
  tensor_parallel_size: 8
  max_model_len: 4096
  # mem_fraction_static in SGLang; lower leaves headroom for runtime/graph buffers on H100.
  gpu_memory_utilization: 0.75
  kv_cache_dtype: fp8_e4m3
  sglang_kwargs:
    quantization: w4afp8
    disable_shared_experts_fusion: true
    # H100 80GB: weights fill ~76GB/GPU; CUDA graph capture OOMs without this.
    disable_cuda_graph: true
    # PCG is ON by default in 0.5.13+; disable both graph paths for H100 eval.
    disable_piecewise_cuda_graph: true
    chunked_prefill_size: 2048
    max_running_requests: 4

eval:
  enabled: true
  log_samples: true
  backend: sglang
  apply_chat_template: true
  baseline: null
  tasks:
    - name: wikitext
      metric: word_perplexity,none
      higher_is_better: false
      num_fewshot: 0
      limit: null
    - name: mmlu
      metric: acc,none
      num_fewshot: 5
      limit: null
    - name: arc_challenge
      metric: acc_norm,none
      num_fewshot: 25
      limit: null
    - name: hellaswag
      metric: acc_norm,none
      num_fewshot: 10
      limit: null
    - name: winogrande
      metric: acc,none
      num_fewshot: 5
      limit: null
    - name: gsm8k
      metric: exact_match,strict-match
      num_fewshot: 5
      limit: null
    - name: truthfulqa_mc2
      metric: acc,none
      num_fewshot: 0
      limit: null
    - name: bbh
      metric: exact_match,get-answer
      num_fewshot: 3
      limit: null

agentic:
  enabled: false

quantization:
  method: gptq
  scheme: W4AFP8
