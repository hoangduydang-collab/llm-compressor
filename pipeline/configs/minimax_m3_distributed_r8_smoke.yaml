# r8 smoke: first distributed-pipeline GPTQ run AND first mixed-precision
# recipe (int4 routed experts + FP8_DYNAMIC on attention / shared experts /
# dense MLP). Clone of minimax_m3_distributed_smoke.yaml with the r8
# fp8_dynamic_targets added, layer-scoped so the smoke stays self-documenting:
#   - GPTQ W4AFP8 experts: layers 3, 8, 31, 59 (unchanged eligibility gate)
#   - FP8 attention (q/k/v/o, NOT the indexer): layers 0, 3, 8
#   - FP8 shared experts (fused gate_up_proj + down_proj): layers 3, 8
#   - FP8 dense MLP (fused gate_up_proj + down_proj): layer 0
# Layer 0 is included deliberately: the dense/shared MLPs are FUSED
# gate_up_proj Linears in memory but split gate/up on disk — the smoke must
# prove the save-side conversion handles an FP8-quantized fused tensor
# (weight + per-channel weight_scale) before the full run spends 8h.
# The attention indexer (self_attn.indexer.{q,k}_proj) stays BF16 by design:
# ~3.9M params/layer (negligible bandwidth) and it selects which tokens
# attention sees (outsized quality risk).
name: minimax_m3_distributed_r8_smoke

model:
  id: MiniMaxAI/MiniMax-M3
  trust_remote_code: true
  auto_class: AutoModelForImageTextToText
  dtype: bfloat16
  device_map: auto_offload
  max_memory:
    cpu: 32000000000
  offload_folder: /mnt/nfs/hoangduy/offload/m3-distributed-smoke

quantization:
  method: gptq
  scheme: W4AFP8
  ignore:
    - "lm_head"
    - "re:.*vision_tower.*"
    - "re:.*multi_modal_projector.*"
    - "re:.*patch_merge_mlp.*"
    - "re:.*mlp[.]gate$"
    - "re:.*block_sparse_moe[.]gate$"
    - "re:.*mlp[.]shared_experts[.].*"
    - "re:.*block_sparse_moe[.]shared_experts[.].*"
    - "re:.*self_attn[.].*"
    - "re:.*layers[.][0-2][.].*"
    - "re:.*language_model[.]layers[.](?!(?:3|8|31|59)(?:[.]|$))[0-9]+(?:[.]|$).*"
  fp8_dynamic_targets:
    - "re:.*language_model[.]layers[.](0|3|8)[.]self_attn[.](q|k|v|o)_proj$"
    - "re:.*language_model[.]layers[.](3|8)[.]mlp[.]shared_experts[.](gate_up_proj|down_proj)$"
    - "re:.*language_model[.]layers[.]0[.]mlp[.](gate_up_proj|down_proj)$"
  sample_generation: false

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  num_samples: 8
  max_seq_length: 512
  seed: 42
  moe_calibrate_all_experts: true
  sequential_targets: ["MiniMaxM3VLDecoderLayer"]
  pipeline: sequential

serve:
  enabled: false

eval:
  enabled: false

output_dir: /mnt/nfs/hoangduy/results/m3-distributed-quant-smoke
