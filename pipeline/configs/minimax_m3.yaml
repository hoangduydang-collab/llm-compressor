# Stage 4 - MiniMax-M3 candidate checkpoints (W4AFP8 / W4A8).
#
# PREREQUISITE (Stage 3): confirm M3 MoE linearization works (see
# pipeline/README.md "MiniMax-M3 enablement"). The ignore regexes below are a
# STARTING POINT and MUST be confirmed against the real module names in the M3
# config / remote code before a production run: keep the vision encoder, the MSA
# attention indexer, the MoE gate, and lm_head out of quantization.
#
#   python -m pipeline.run --config pipeline/configs/minimax_m3.yaml \
#       --set quantization.scheme=W4A8     # and W4AFP8
name: minimax_m3

model:
  id: MiniMaxAI/MiniMax-M3
  trust_remote_code: true
  # M3 is a VL (image-text-to-text) MoE; load the full model so the language
  # backbone is quantized while the vision tower is kept (ignored) and saved.
  auto_class: AutoModelForImageTextToText
  dtype: bfloat16
  # ~428B params: load to CPU/disk and let the sequential pipeline onload
  # one decoder layer at a time onto the GPU during calibration.
  device_map: null
  # For nodes with limited CPU RAM, switch to disk offload:
  # device_map: auto_offload
  # offload_folder: ./offload
  # max_memory: {cpu: 500e9}

quantization:
  method: gptq            # sweep gptq | awq | smoothquant+gptq | smoothquant+awq
  scheme: W4AFP8          # and W4A8
  # Module paths verified against transformers 5.12.1 modeling_minimax_m3_vl.py.
  # Experts (MiniMaxM3VLExperts) carry @use_experts_implementation -> they
  # auto-linearize; no custom MoE calibration module is needed.
  # Keep-bf16 strategy aligned with cyankiwi/MiniMax-M3-AWQ-INT4 (translated to
  # transformers 5.12.1 module names). Only sparse MoE layers 3-59 are quantized.
  ignore:
    - "lm_head"
    - "re:.*vision_tower.*"
    - "re:.*multi_modal_projector.*"
    - "re:.*patch_merge_mlp.*"
    - "re:.*mlp[.]gate$"                 # MoE router
    - "re:.*mlp[.]shared_experts[.].*"   # shared experts
    - "re:.*self_attn[.]indexer[.].*"     # MSA sparse indexer
    - "re:.*layers[.][0-2][.].*"          # first 3 dense/full-attn layers
  # 428B model calibrates offloaded (CPU/disk); autoregressive generation is ~minutes
  # per token. Skip the post-quant sanity gen and validate via serve_verify instead.
  sample_generation: false

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  # SMOKE settings: tiny calibration to validate the full pipeline end-to-end
  # (load -> linearize -> FX trace -> quantize -> save) quickly. Restore the
  # production values below for a real quantization run:
  #   num_samples: 512
  #   max_seq_length: 2048
  num_samples: 8
  max_seq_length: 512
  moe_calibrate_all_experts: true
  # Onload one decoder layer at a time during calibration (428B model).
  sequential_targets: ["MiniMaxM3VLDecoderLayer"]

serve:
  enabled: true
  tensor_parallel_size: 8
  enable_expert_parallel: true
  block_size: 128            # MSA sparse block size; defaults fail KV init
  kv_cache_dtype: fp8
  max_model_len: 32768
  gpu_memory_utilization: 0.9
  # CUDA graphs on by default. FlashInfer fused AR is skipped during capture via
  # patch_vllm_m3_serve.py (NCCL fallback). ENFORCE_EAGER=1 if graph capture fails.
  enforce_eager: false
  # vLLM's custom (P2P/IPC) all-reduce deadlocks on this 2x4 H100 topology: all 8
  # workers hang in custom_all_reduce.py at the FIRST TP collective (the vocab
  # embedding all_reduce in VocabParallelEmbedding.forward), which surfaces as the
  # decode-time "No available shared memory broadcast block found in 60s" ->
  # sample_tokens timeout. Route TP all-reduce through NCCL instead. See
  # BUGS_AND_FIXES.md ("custom all-reduce deadlock").
  disable_custom_all_reduce: true
  prompt: "The capital of France is"
  # The HTTP server additionally needs (not used by offline serve-verify):
  #   --tool-call-parser minimax_m3 --reasoning-parser minimax_m3
  #   --enable-auto-tool-choice --trust-remote-code
  extra_args:
    - "--tool-call-parser=minimax_m3"
    - "--reasoning-parser=minimax_m3"
    - "--enable-auto-tool-choice"

eval:
  enabled: true
  baseline: null            # point at the BF16/MXFP8 M3 baseline metrics JSON
  recovery_threshold: 0.94
  max_ppl_increase: 0.10
  # tasks: default 8-task full suite — see full_static_tasks() in config.py

output_dir: ./artifacts
