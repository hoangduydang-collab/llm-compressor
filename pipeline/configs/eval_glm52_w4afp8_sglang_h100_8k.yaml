# GLM-5.2-W4AFP8 static eval on 8x H100 80GB with max_model_len=8192.
#
# Weights ~57 GiB/GPU leave ~20 GiB for KV, graph capture, and prefill peaks.
# Tune order if OOM: lower max_running_requests → lower max_total_tokens →
# lower lm_eval_batch_size → lower gpu_memory_utilization → smaller chunked_prefill_size.
#
#   bash pipeline/slurm/run_eval_glm52_sglang_detached.sh
#   CONFIG=pipeline/configs/eval_glm52_w4afp8_sglang_h100_8k.yaml ...
#
# On 8x H200 141GB use eval_glm52_w4afp8_sglang_h200.yaml instead (more headroom).

name: eval-glm52-w4afp8-sglang-h100-8k

model:
  id: /mnt/nfs/hoangduy/hf_assets/PhalaCloud/GLM-5.2-W4AFP8
  trust_remote_code: true

serve:
  tensor_parallel_size: 8
  max_model_len: 8192
  # Leave headroom for 8k prefill peaks + CUDA graph capture (avoid 0.85 on H100).
  gpu_memory_utilization: 0.72
  kv_cache_dtype: fp8_e4m3
  sglang_compat_fallbacks: true
  sglang_kwargs:
    quantization: w4afp8
    disable_shared_experts_fusion: true
    # CUDA graphs ON (omit disable_cuda_graph / disable_piecewise_cuda_graph).
    # Pool ≈ max_running_requests × max_model_len at full length.
    max_total_tokens: 32768
    chunked_prefill_size: 512
    max_running_requests: 4

eval:
  enabled: true
  log_samples: true
  backend: sglang
  # Pairs with max_running_requests=4; drop to 4 if OOM on arc 25-shot prefill.
  lm_eval_batch_size: 8
  apply_chat_template: true
  baseline: null
  tasks:
    - name: wikitext
      metric: word_perplexity,none
      higher_is_better: false
      num_fewshot: 0
      limit: null
    - name: mmlu
      metric: acc,none
      num_fewshot: 5
      limit: null
    - name: arc_challenge
      metric: acc_norm,none
      num_fewshot: 25
      limit: null
    - name: hellaswag
      metric: acc_norm,none
      num_fewshot: 10
      limit: null
    - name: winogrande
      metric: acc,none
      num_fewshot: 5
      limit: null
    - name: gsm8k
      metric: exact_match,strict-match
      num_fewshot: 5
      limit: null
    - name: truthfulqa_mc2
      metric: acc,none
      num_fewshot: 0
      limit: null
    - name: bbh
      metric: exact_match,get-answer
      num_fewshot: 3
      limit: null

agentic:
  enabled: false

quantization:
  method: gptq
  scheme: W4AFP8
