schema_version: 1
# Quick smoke eval of the in-house full-calibration AWQ W4AFP8 (r5-deadchan,
# 512x2048 calib, dead-channel fix e87eef77). Single arm, 1 node TP8/mp.
#
# PURPOSE: profile=smoke setup validation + directional quality signal on the
# tiny stratified manifest. NOT score-comparable to any public leaderboard
# recipe and NOT the production verdict; the production run uses
# profile=production on the same contract (eval_minimax_m3_reasoning_r4.yaml,
# same aliases/seed/sampling as the paired r48 and BF16 qualification roots,
# so cross-run contract gating and later three-way comparison stay valid).
#
# PATH NOTE: points directly at r5's checkpoint-vllm-w123 re-export. Unlike
# the older GPTQ export (which needed an ABI overlay), the current
# reexport_minimax_m3_vllm already writes the vLLM router/shared-expert
# ignore aliases into config.json; m3_serve_abi passes on the raw export
# (verified 2026-07-20, static_direct_r5.json valid=true).
name: minimax-m3-inhouse-awq-r5-smoke
backend: vllm
baseline_label: inhouse_awq
model_source: /mnt/nfs/hoangduy/hf_assets/MiniMaxAI/MiniMax-M3
eval_config: pipeline/configs/eval_minimax_m3_reasoning_r4.yaml

models:
  - label: inhouse_awq
    path: /mnt/nfs/hoangduy/results/m3-distributed-awq-full/20260720T060340Z-m3-ddp-awq-full-r5-deadchan/awq/MiniMax-M3-awq-W4AFP8/20260720-060402/checkpoint-vllm-w123
    kind: awq-w4afp8
    nodes: 1
    tensor_parallel_size: 8
    distributed_executor_backend: mp

shards:
  # Single shard -> one arm -> the model is served once (fastest smoke).
  - name: reasoning_suite
    tasks: [gpqa_diamond, mmlu_pro, gsm8k, aime_2025]
    distributional_probe: false

task_aliases:
  gpqa_diamond: [gpqa_diamond_cot_zeroshot]
  mmlu_pro: [mmlu_pro]
  gsm8k: [gsm8k_cot]
  aime_2025: [aime25, aime_2025]

sampling:
  seed: 42
  mmlu_pro_samples: 100
  production_samples_per_task: 100

scheduling:
  max_parallel_arms: 1
  arm_time_limit: "24:00:00"

probe:
  enabled: false
  total_tokens: 8192
  top_k: 20
  max_overhead_seconds: 900

gates:
  # Setup-only smoke policy, matching the paired r48 / BF16 qualification runs.
  max_smoke_empty_outputs: 1
  max_task_drop: 0.02
  min_macro_recovery: 0.98
  max_conditional_regression: 0.05
  max_perplexity_increase: null
  max_degeneration_failures: 0
