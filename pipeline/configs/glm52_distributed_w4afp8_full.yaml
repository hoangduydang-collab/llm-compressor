# GLM-5.2 W4AFP8: distributed GPTQ int4-g128 on routed experts + FP8_DYNAMIC
# (W8A8) on MLA attention / shared experts / the three dense layers, quantized
# from source BF16.
#
# ############################################################################
# STATUS 2026-08-26: DO NOT LAUNCH. Two blockers, both established on-cluster,
# both needing a decision rather than more investigation. See "BLOCKER 1/2"
# below. The target/ignore patterns themselves are verified and can stand.
# ############################################################################
#
# BLOCKER 1 — the MTP head, and it is not hypothetical.
#   * Production runs speculative decoding for GLM-5.2 today:
#     glm-5-2-jp-1m uses --speculative-algorithm=EAGLE --speculative-num-steps=5
#     --speculative-num-draft-tokens=6 ("native MTP head"), and glm-5-2-ca-pd
#     uses steps=2 / draft-tokens=3.
#   * Both reference checkpoints carry the head. PhalaCloud/GLM-5.2-W4AFP8's
#     weight index has 2337 tensors under model.layers.78, including eh_proj,
#     enorm, hnorm and a full 256-expert MoE, all quantized. zai-org/GLM-5.2-FP8
#     likewise lists layers.78.{eh_proj,enorm,hnorm,shared_head.norm}.
#   * transformers 5.12.1 does not model it: zero references to
#     nextn/mtp/eh_proj/enorm/hnorm in modeling_glm_moe_dsa.py, and
#     num_nextn_predict_layers is not a recognised config field. It also does not
#     model `self_attn.indexers_proj` or `shared_head`, both of which appear in
#     the official checkpoint.
#   So a transformers load builds layers 0-77 and this recipe would emit a
#   checkpoint missing the entire MTP head — unservable in production's
#   configuration. Quality evaluation CANNOT catch this; only decode speed
#   changes. Resolve before spending GPU time, not after.
#
# BLOCKER 2 — no BF16 source is staged, and the old cluster is gone.
#   The only GLM-5.2 weights on the Rancher shared cache (`model-cache-shared`,
#   mounted /mnt/cephfs, 70T free) are:
#     .hf-cache/models--zai-org--GLM-5.2-FP8        (model_type glm_moe_dsa,
#        quant_method fp8, weight_block_size [128,128], activation dynamic)
#     .hf-cache/models--PhalaCloud--GLM-5.2-W4AFP8  (the comparator)
#   `zai-org/GLM-5.2` BF16 is NOT staged and is roughly 1.5 TB to fetch. So the
#   choice is: stage the BF16 release, or quantize from the FP8 release (which
#   means dequantising a 128x128 block-scaled FP8 checkpoint as the GPTQ source
#   — plausible, probably what Phala did, but it is a different experiment and
#   must be labelled as one). `dtype: bfloat16` below assumes the former.
#
# Structurally this is minimax_m3_distributed_r8_full.yaml — same two-modifier
# design, same disjoint-set discipline (GPTQ ignores what the FP8 modifier owns
# by explicit target), same data-free FP8_DYNAMIC so there is no second
# calibration pass and no r5-class fold risk. Every *pattern* differs, because
# GLM-5.2 is a different architecture; see "Why M3's patterns cannot be reused".
#
# Motivation, re-derived for this model (do not carry M3's numbers over).
# Per-token activated weight bytes in one MoE layer at BF16 — H=6144, I=2048,
# 8 of 256 experts, MLA q_lora 2048 / kv_lora 512 / 64 heads:
#
#   routed experts (8 active)   576.0 MiB   58.7%
#   MLA attention               314.8 MiB   32.1%
#   shared expert                72.0 MiB    7.3%
#   indexer (stays BF16)         17.9 MiB    1.8%
#   TOTAL                       980.6 MiB
#
# The indexer row applies only to the 21 "full" layers — read from the released
# config's explicit `indexer_types` list: 0, 1, 2, then every 4th from 6 to 74.
# The other 57 layers carry no indexer projections at all, so the whole-model
# indexer share is nearer 0.5% than 1.8%.
#
# Do NOT derive that pattern from `index_topk_freq`. When `indexer_types` is
# absent, transformers synthesises a *different* default (0, 1, then every 4th
# from 5 to 77), which is what an earlier revision of this file recorded. Any
# preflight must be pointed at the real config.json.
#
#   BF16 everywhere               980.6 MiB   1.00x
#   + int4-g128 routed experts    550.9 MiB   1.78x
#   + FP8 attention & shared      357.5 MiB   2.74x   (marginal 1.54x)
#
# Note the shares are NOT M3's: attention+shared is 39.4% of BF16 activated
# bytes here against M3's 74%. The FP8 leg is still worth taking for the same
# reason it was there, but the reason has to be stated the other way round —
# once the routed experts are int4, attention+shared is 70.2% of what remains,
# so halving it yields 1.54x, near-identical to M3's quoted 1.55x. Whole model:
# ~74.7 GiB BF16 -> ~27.2 GiB.
#
# Why M3's patterns cannot be reused (audited against the real module tree,
# not assumed — all three of M3's fp8_dynamic_targets match ZERO modules here):
#   1. No `language_model.` prefix. M3 is a VL model (AutoModelForImageTextToText)
#      and nests the decoder; GLM-5.2 is text-only, so it is `model.layers.N`.
#   2. GLM-5.2 uses MLA, not dense QKV. There is no `(q|k|v|o)_proj` set — it is
#      q_a_proj / q_b_proj / kv_a_proj_with_mqa / kv_b_proj / o_proj. M3's
#      pattern would have matched o_proj alone had the prefix been right.
#   3. GLM's shared experts and dense MLPs are UNFUSED (gate_proj + up_proj +
#      down_proj), where M3 fuses them into gate_up_proj.
# Reusing M3's file would not crash. It would silently quantize nothing to FP8
# and hand back a checkpoint 1.54x heavier in weight traffic than intended,
# while passing every gate that only checks the int4 side.
#
# Comparability with the community checkpoint we already evaluated (goal 2d).
# Read from PhalaCloud/GLM-5.2-W4AFP8's own weight index on /mnt/cephfs, not
# inferred: per MoE layer it carries `weight` + `weight_scale_inv` +
# `input_scale` on all 3x256 routed-expert projections (int4 weights, block
# scales, and a STATIC activation scale), `weight_scale_inv` on all five MLA
# projections, on all three shared-expert projections, and on the dense MLPs.
#
# Differences from this recipe, all of which must be named in any comparison:
#   - method: GPTQ here, AWQ there (goal 2d found Phala's AWQ leg clean; the M3
#     AWQ pathology of goal 3b did not replicate on this family)
#   - activations: FP8_DYNAMIC per-token here, static `input_scale` there
#   - THE INDEXER IS NOT PLACEMENT-IDENTICAL. Phala quantizes
#     `self_attn.indexer.wq_b` and `self_attn.indexer.wk` to FP8, leaving only
#     `weights_proj` and `k_norm` alone. This recipe keeps the whole indexer
#     BF16, following the M3 precedent and our own recorded long-context
#     retrieval failure from touching indexer precision. That is a deliberate
#     divergence, not an oversight — but it does mean the paired eval is not a
#     single-variable comparison, and if the two checkpoints differ on
#     long-context retrieval this is the first thing to suspect.
#   - format: Phala declares only {"quant_method": "w4afp8"} — SGLang-native,
#     not compressed-tensors — AND re-types the model as
#     `model_type: deepseek_v3` while keeping
#     `architectures: [GlmMoeDsaForCausalLM]`, routing it through SGLang's
#     DeepSeek-V3 path. Ours will be compressed-tensors W4AFP8 with
#     model_type glm_moe_dsa, so do NOT copy the `quantization: w4afp8` sglang
#     kwarg from eval_glm52_w4afp8_sglang.yaml for our arm without re-checking
#     the loader.
#
# RED LINE: index_topk_freq / index_topk are not to be touched by this or any
# downstream config. The indexer stays BF16 by design (tiny — 1.8% of activated
# bytes — and token-selection quality risk).
#
# Gate order: run glm52_distributed_w4afp8_smoke.yaml first. This is the first
# GPTQ run on a family that is not M3, and our pre-quantization static gates
# are still M3-specific (goal 5).
name: glm52_distributed_w4afp8_full

model:
  # BLOCKED: not staged. See BLOCKER 2. The FP8 release IS staged at
  # /mnt/cephfs/.hf-cache/models--zai-org--GLM-5.2-FP8 if we choose that source.
  id: zai-org/GLM-5.2
  trust_remote_code: true
  auto_class: AutoModelForCausalLM
  dtype: bfloat16
  device_map: auto_offload
  # Same small-cpu-budget rationale as the M3 distributed configs (shm VMA
  # exhaustion; bulk weights go to DistributedDiskCache).
  max_memory:
    cpu: 32000000000
  # Rancher only now: the old SSH cluster's /mnt/nfs is gone. model-cache-shared
  # is the sole CA-region RWX storage (see the region note below).
  offload_folder: /mnt/cephfs/hoangduy/offload/glm52-w4afp8-full

quantization:
  method: gptq
  scheme: W4AFP8
  # GPTQ owns the routed experts only. Everything listed here is either owned by
  # the FP8 modifier via fp8_dynamic_targets (disjoint sets) or stays BF16.
  ignore:
    - "lm_head"
    # GlmMoeDsaTopkRouter holds `gate.weight` as a bare Parameter rather than an
    # nn.Linear, so it is not a quantization target today. Kept explicit so it
    # stays out of scope if that ever changes.
    - "re:.*mlp[.]gate$"
    # Owned by the FP8 modifier below.
    - "re:.*mlp[.]shared_experts[.].*"
    # Covers both the MLA projections (FP8, below) and the DSA indexer (BF16).
    - "re:.*self_attn[.].*"
    # first_k_dense_replace = 3 -> layers 0,1,2 are dense GlmMoeDsaMLP.
    - "re:.*layers[.][0-2][.].*"
    # Defensive: the MTP layer would be index 78 (num_hidden_layers = 78).
    - "re:.*layers[.]78[.].*"
  fp8_dynamic_targets:
    # MLA projections, enumerated — this also excludes self_attn.indexer.*
    # (wq_b / wk / weights_proj), which must remain BF16.
    - "re:.*model[.]layers[.][0-9]+[.]self_attn[.](q_a_proj|q_b_proj|kv_a_proj_with_mqa|kv_b_proj|o_proj)$"
    # Shared experts are unfused on this architecture.
    - "re:.*model[.]layers[.][0-9]+[.]mlp[.]shared_experts[.](gate_proj|up_proj|down_proj)$"
    # The three dense layers, likewise unfused.
    - "re:.*model[.]layers[.][0-2][.]mlp[.](gate_proj|up_proj|down_proj)$"
  gptq_dampening_frac: 0.01
  sample_generation: false

calibration:
  dataset_id: HuggingFaceH4/ultrachat_200k
  dataset_split: train_sft
  num_samples: 512
  max_seq_length: 2048
  seed: 42
  # 256 experts at top-8 means a 512-sample set touches any given expert rarely;
  # calibrating all experts is not optional here the way it might be at M3's
  # 128/top-4.
  moe_calibrate_all_experts: true
  sequential_targets: ["GlmMoeDsaDecoderLayer"]
  pipeline: sequential

serve:
  enabled: false

eval:
  enabled: false

output_dir: /mnt/cephfs/hoangduy/results/glm52-w4afp8-full
